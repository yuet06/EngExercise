<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6366f1" />
<title>Vocabulary Trainer</title>
<style>
/* ============================================================
   VOCABULARY TRAINER — all styles live here.
   Colours are grouped in ":root" so they are easy to change.
   ============================================================ */
:root{
  --bg-1:#eef2ff;
  --bg-2:#fdf2f8;
  --card:#ffffff;
  --text:#1e1b4b;
  --muted:#6b7280;
  --line:#e5e7eb;
  --accent:#6366f1;
  --accent-2:#8b5cf6;
  --pink:#ec4899;
  --good:#16a34a;
  --good-bg:#dcfce7;
  --bad:#dc2626;
  --bad-bg:#fee2e2;
  --warn:#f59e0b;
  --shadow:0 10px 30px rgba(49,46,129,.10);
  --shadow-sm:0 4px 14px rgba(49,46,129,.08);
  --radius:20px;
  --font:"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Segoe UI Symbol",sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  color:var(--text);
  background:
    radial-gradient(1100px 600px at 10% -10%, #e0e7ff 0%, transparent 55%),
    radial-gradient(900px 500px at 100% 0%, #fce7f3 0%, transparent 50%),
    linear-gradient(160deg,var(--bg-1),var(--bg-2));
  background-attachment:fixed;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default}

.wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px}

/* ---------- generic pieces ---------- */
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:24px;
  animation:rise .28s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-size:17px;font-weight:700;letter-spacing:.2px;
  padding:14px 26px;border-radius:999px;
  background:#eef2ff;color:var(--text);
  transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2) 55%,var(--pink));
  color:#fff;box-shadow:0 12px 26px rgba(99,102,241,.38);
}
.btn.ghost{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);color:var(--muted);font-weight:600}
.btn.big{font-size:20px;padding:18px 52px;width:100%;max-width:340px}
.btn.small{font-size:14px;padding:9px 16px}
.btn[disabled]{opacity:.45;box-shadow:none;transform:none}

.icon-btn{
  width:42px;height:42px;border-radius:14px;flex:0 0 auto;
  display:grid;place-items:center;font-size:20px;
  background:#fff;box-shadow:var(--shadow-sm);border:1px solid var(--line);
  transition:transform .12s ease;
}
.icon-btn:hover{transform:translateY(-2px)}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.topbar-title{flex:1;min-width:0;text-align:center;line-height:1.15}
.tt-main{display:block;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-sub{display:block;font-size:13px;color:var(--muted);font-weight:600}

/* ---------- home ---------- */
.hero{text-align:center;padding:44px 20px 34px}
.hero-emoji{font-family:var(--emoji);font-size:74px;line-height:1;animation:pop .5s ease both}
.hero h1{margin:14px 0 6px;font-size:34px;letter-spacing:-.5px}
.hero p{margin:0 auto 26px;color:var(--muted);font-size:16px;max-width:420px;line-height:1.5}
.overall{
  max-width:340px;margin:26px auto 0;background:#fff;border-radius:18px;
  padding:16px 18px;box-shadow:var(--shadow-sm);border:1px solid var(--line);
}
.overall .row{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:9px}
.overall .row span:last-child{color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:999px;background:#eef2ff;overflow:hidden}
.bar > i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--pink));transition:width .4s ease}
.home-foot{text-align:center;margin-top:30px}
.home-extra{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}
.btn.soft{background:#fff7ed;border:2px solid #fed7aa;color:#9a3412;box-shadow:var(--shadow-sm)}

/* ---------- fun stuff: the sticker book ---------- */
/* the sticker won at the end of a level */
.sticker-won{
  display:flex;align-items:center;justify-content:center;gap:12px;
  background:#fff7ed;border:2px solid #fed7aa;border-radius:18px;
  padding:10px 16px;margin:12px 0 2px;font-weight:800;color:#9a3412;
}
.sticker-won span{font-family:var(--emoji);font-size:38px;line-height:1;animation:pop .5s ease both}

/* sticker book — one section per topic, one sticker per level */
.sticker-section{margin:0 0 22px}
.sticker-topic{
  font-size:16px;font-weight:800;color:var(--text);
  margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line);
}
.sticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
@media (max-width:420px){.sticker-grid{grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px}}
.sticker{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:10px 4px;border-radius:16px;
  background:#f8faff;border:2px dashed var(--line);
  animation:pop .4s ease both;
}
.sticker.got{background:#fff7ed;border:2px solid #fed7aa;box-shadow:var(--shadow-sm)}
.sticker .sticker-emoji{font-family:var(--emoji);font-size:32px;line-height:1}
.sticker:not(.got) .sticker-emoji{opacity:.3;filter:grayscale(1)}
.sticker .sticker-label{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.sticker.got .sticker-label{color:#9a3412}

/* ---------- section heading ---------- */
.screen-title{text-align:center;margin:6px 0 20px}
.screen-title h2{margin:0 0 4px;font-size:24px}
.screen-title p{margin:0;color:var(--muted);font-size:14px}

/* ---------- topic grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.topic-card{
  text-align:left;background:#fff;border-radius:18px;padding:18px;
  box-shadow:var(--shadow-sm);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:12px;
  transition:transform .14s ease, box-shadow .14s ease;
}
.topic-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.topic-top{display:flex;align-items:center;gap:12px}
.topic-icon{font-family:var(--emoji);font-size:34px;line-height:1}
.topic-name{display:block;font-size:18px;font-weight:800}
.topic-meta{display:block;font-size:13px;color:var(--muted);font-weight:600}
.topic-card .bar{height:8px}

/* ---------- level list ---------- */
.levels{display:flex;flex-direction:column;gap:12px}
.level-card{
  width:100%;display:flex;align-items:center;gap:14px;text-align:left;
  background:#fff;border-radius:18px;padding:16px 18px;
  box-shadow:var(--shadow-sm);border:1px solid var(--line);
  transition:transform .14s ease, box-shadow .14s ease;
}
.level-card:hover:not(:disabled){transform:translateY(-3px);box-shadow:var(--shadow)}
.level-card:disabled{opacity:.6;background:#f8fafc}
.level-num{
  width:46px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;
  font-weight:800;font-size:18px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
}
.level-card:disabled .level-num{background:#cbd5e1}
.level-info{flex:1;min-width:0;display:block}
.level-name{display:block;font-size:16px;font-weight:800}
.level-meta{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.level-end{font-size:15px;font-weight:800;text-align:right;white-space:nowrap}
.chev{font-size:22px;color:#c7d2fe;font-weight:800}

/* ---------- learning screen ---------- */
.steps{display:flex;gap:8px;margin-bottom:14px}
.step{
  flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:10px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-family:inherit;cursor:pointer;
  transition:transform .12s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease;
}
.step:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.step:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.step .dot{
  width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  background:#eef2ff;color:var(--accent);font-size:11px;font-weight:800;
}
.step.active{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.step.active:hover{transform:none}
.step.active .dot{background:var(--accent);color:#fff}
.step.done{color:var(--good);border-color:#bbf7d0;background:#f0fdf4}
.step.done .dot{background:var(--good);color:#fff}

.qbar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.qbar-wrap .bar{flex:1}

/* ---------- learning screen layout ----------
   The screen fills the window and the picture sits in the middle of the
   empty space, with the answers underneath it. */
.screen-learn{display:flex;flex-direction:column;min-height:calc(100vh - 78px)}
/* position:relative so the 🔊 button can sit in this card's corner */
.play-card{position:relative;display:flex;flex-direction:column;flex:1 0 auto}
/* the picture (+ Chinese), centred both ways in the space above the answers.
   "1 0 auto" means it fills the spare room but can never be squashed smaller
   than the picture, even when a long word needs several rows of tiles. */
.prompt-zone{
  flex:1 0 auto;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:6px 0 16px;
}
.answer-zone{flex:0 0 auto}

.prompt-visual{display:flex;align-items:center;justify-content:center;margin:0}
/* the Traditional Chinese meaning, just under the picture */
.prompt-chinese{
  text-align:center;
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC","Microsoft YaHei",sans-serif;
  font-size:26px;font-weight:700;line-height:1.3;color:var(--text);
  letter-spacing:2px;margin:10px 0 0;
}
.prompt-emoji{font-family:var(--emoji);font-size:5.5rem;line-height:1;display:inline-block;animation:pop .38s ease both}
.prompt-img{max-width:240px;max-height:190px;border-radius:16px;display:inline-block;vertical-align:middle}

/* the 🔊 replay button — round, easy to tap, sitting in the TOP-RIGHT
   corner of the question box. It is absolutely positioned, so it never
   moves the emoji, the Chinese text or the answers.
   Change "top" and "right" below to put it in a different corner. */
.speak-btn{
  position:absolute;top:14px;right:14px;z-index:5;
  width:48px;height:48px;border-radius:50%;
  display:grid;place-items:center;font-size:21px;line-height:1;
  background:#fff;border:2px solid #dfe4fa;box-shadow:0 4px 12px rgba(49,46,129,.16);
  touch-action:manipulation;
  transition:transform .12s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
}
.speak-btn:hover{transform:translateY(-2px)}
.speak-btn:active{transform:scale(.93)}
.speak-btn.speaking{background:#eef2ff;border-color:var(--accent);animation:speakPulse 1.1s ease-in-out infinite}
@keyframes speakPulse{
  0%{box-shadow:0 0 0 0 rgba(99,102,241,.5)}
  70%{box-shadow:0 0 0 12px rgba(99,102,241,0)}
  100%{box-shadow:0 0 0 0 rgba(99,102,241,0)}
}
/* activity name + "Question 2 / 6" above the question */
.qhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 10px}
.qhead-title{font-size:17px;font-weight:800;color:var(--text)}
.qhead-count{font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}

/* Multiple choice — Stage 1 changes COLOUR only:
   green when the word is right, red when it is wrong.
   No tick and no cross icons are drawn on the buttons. */
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:420px){.options{grid-template-columns:1fr}}
.option{
  padding:18px 14px;border-radius:16px;background:#f8faff;border:2px solid #e6e9fb;
  font-size:19px;font-weight:800;letter-spacing:.3px;
  transition:transform .12s ease, background .15s ease, border-color .15s ease, color .15s ease;
}
.option:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent);background:#eef2ff}
.option:disabled{cursor:default}
/* exactly the same green and red that Stage 2 and Stage 3 use.
   The :hover copies keep the colour from being overridden while hovering. */
.option.good,.option.good:hover{background:var(--good-bg);border-color:var(--good);color:#15803d}
.option.bad,.option.bad:hover{background:var(--bad-bg);border-color:var(--bad);color:#b91c1c}

/* arrange letters */
.slots{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin:0 0 22px;min-height:56px}
.slot{
  width:46px;height:56px;border-radius:14px;display:grid;place-items:center;
  font-size:26px;font-weight:800;text-transform:lowercase;
  background:#f8faff;border:2px dashed #dbe1f8;color:#c7cbe8;
}
.slot.filled{border-style:solid;border-color:var(--accent);color:var(--text);background:#eef2ff}
.slots.good .slot{border-color:var(--good);background:var(--good-bg);color:#15803d;animation:pop .3s ease both}
.slots.bad .slot{border-color:var(--bad);background:var(--bad-bg);color:#b91c1c}
.shake{animation:shake .45s ease both}

/* ONE WRAPPER PER WORD — this is what stops a word being split over two rows.
   .word-group is a flex item of .slots, so the row container moves the whole
   word down to the next row when it does not fit. Because the group may wrap
   inside itself, a word that is longer than the whole row (for example
   "Territories" on a small phone) still folds instead of running off screen. */
.word-group{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;white-space:nowrap}
/* the fixed space between two words: it is part of the answer, shown as a gap.
   It has no box, so the learner can see the words are separate but cannot
   pick it up or remove it. */
.slot.space{width:16px;min-width:16px;border:0;background:none;box-shadow:none}

.tiles{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-bottom:20px}
/* the letter tiles are grouped by word in exactly the same way */
.tile-group{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.tile{
  min-width:52px;height:56px;padding:0 12px;border-radius:14px;
  background:linear-gradient(180deg,#ffffff,#f4f6ff);border:2px solid #dfe4fa;
  box-shadow:0 3px 0 #dfe4fa;
  font-size:24px;font-weight:800;text-transform:lowercase;
  transition:transform .1s ease;
}
.tile:hover:not(:disabled){transform:translateY(-3px)}
.tile:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 #dfe4fa}
.tile.used{opacity:0;pointer-events:none}

/* type the word */
.type-wrap{position:relative;margin-bottom:18px}
.ghost-input{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;border:0;background:transparent;outline:none;
  font-size:16px;caret-color:transparent;
}
.type-hint{text-align:center;font-size:12px;color:var(--muted);font-weight:600;margin-top:-6px}

/* ---------- Dictionary (look up a word + the learner's own list) ----------
   Note: the word bank is never drawn on the screen. These styles cover the
   search results, the learner's saved words and the two boxes at the top. */
.mw-search{
  width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);
  font-size:16px;font-family:inherit;background:#fff;margin:0 0 12px;color:var(--text);
}
.mw-search:focus{outline:none;border-color:var(--accent)}
.mw-count{text-align:center;font-size:13px;color:var(--muted);font-weight:700;margin:14px 0 0}
.mw-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.mw-row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow-sm)}
/* one word: picture, the word, its Chinese, then a button (Add / 🗑️) */
.mw-own{display:flex;align-items:center;gap:11px}
.mw-own .mw-emoji{font-family:var(--emoji);font-size:22px;line-height:1;flex:0 0 auto}
.mw-own .mw-txt{flex:1 1 auto;min-width:0}
.mw-own .mw-txt b{display:block;font-weight:800;font-size:17px;word-break:break-word}
.mw-own .mw-txt span{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
.mw-own .btn{flex:0 0 auto}
.mw-del{
  flex:0 0 auto;width:40px;height:40px;border-radius:50%;
  border:2px solid #fecaca;background:#fef2f2;
  font-size:17px;line-height:1;font-family:var(--emoji);cursor:pointer;
  transition:transform .1s ease;
}
.mw-del:hover{transform:translateY(-2px)}
.mw-actions{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:20px}
.mw-actions .btn{width:100%;max-width:340px}
/* the search box with the My Words box beside it */
.mw-add{display:flex;gap:10px;align-items:stretch;margin-bottom:6px}
.mw-add .mw-search{margin:0;flex:1 1 auto;min-width:0}
.mw-add .btn{flex:0 0 auto;padding:0 18px;font-size:15px;white-space:nowrap}
.mw-notice{margin:14px 0 0;padding:11px 14px;border-radius:12px;font-size:14px;font-weight:700;text-align:center}
.mw-notice.ok{background:var(--good-bg);color:#15803d}
.mw-notice.dup{background:#fff7ed;color:#9a3412}
.mw-notice.none{background:var(--bad-bg);color:#b91c1c}

.feedback{text-align:center;min-height:26px;font-size:16px;font-weight:800;margin-top:16px}
.feedback.good{color:var(--good)}
.feedback.bad{color:var(--bad)}
.feedback.hint{color:var(--warn);font-size:14px;font-weight:700}

.actions{display:flex;gap:10px;justify-content:center;margin-top:6px}

/* ---------- completion ---------- */
.done-hero{text-align:center;padding:12px 0 6px}
.done-emoji{font-family:var(--emoji);font-size:76px;line-height:1;animation:pop .5s ease both}
.done-hero h2{margin:12px 0 4px;font-size:28px}
.done-hero p{margin:0;color:var(--muted);font-weight:600}
.big-stars{font-family:var(--emoji);font-size:38px;letter-spacing:6px;margin:14px 0 4px}
.score-list{margin:22px 0;display:flex;flex-direction:column;gap:10px}
.score-row{
  display:flex;align-items:center;gap:12px;background:#f8faff;
  border:1px solid var(--line);border-radius:14px;padding:13px 16px;
}
.score-row .n{
  width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 auto;
}
.score-row .lbl{flex:1;font-weight:700;font-size:15px}
.score-row .val{font-weight:800;font-size:15px;color:var(--muted)}
.score-row.perfect .val{color:var(--good)}
.done-actions{display:flex;flex-direction:column;gap:10px;align-items:center}
.done-actions .btn{width:100%;max-width:340px}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;top:14px;transform:translate(-50%,-24px);
  background:rgba(30,27,75,.94);color:#fff;font-weight:700;font-size:14px;
  padding:12px 20px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
  z-index:50;max-width:92vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

.empty{text-align:center;color:var(--muted);padding:26px;font-weight:600}
@media (max-width:420px){
  .card{padding:18px}
  .screen-learn{min-height:calc(100vh - 90px)}
  .prompt-emoji{font-size:4rem}
  .prompt-chinese{font-size:22px;margin-top:8px}
  .prompt-zone{padding:4px 0 10px}
  .slot{width:38px;height:48px;font-size:22px}
  .word-group{gap:6px}
  .slot.space{width:12px;min-width:12px}
  .tile-group{gap:8px}
  .step{font-size:11px;padding:8px 4px}
  .speak-btn{width:44px;height:44px;font-size:19px;top:10px;right:10px}
}
</style>
</head>
<body>

<div class="wrap">
  <div id="app"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ==================================================================
   📚  VOCABULARY TRAINER
   ------------------------------------------------------------------
   HOW TO ADD YOUR OWN WORDS  (this is the only part you need to edit)

   1. A "topic" is one subject, for example Animals or Food.
   2. Every topic has "levels". Level 1 must be finished before
      Level 2 opens, Level 2 before Level 3, and so on.
   3. Every level has "questions". One question = one word:
          { image: "🐱", word: "cat", chinese: "貓" }
      - "image"   can be any emoji (or a short text). It is what the

    try { window.speechSynthesis.onvoiceschanged = refreshVoices; } catch (e) {}
    refreshVoices();               /* already loaded? */
    setTimeout(refreshVoices, 0);  /* some browsers need a tick */
    setTimeout(refreshVoices, 400);
  }

  function setSpeakingUI(on) {
    speech.speaking = !!on;
    var btns = document.querySelectorAll(".speak-btn");
    for (var i = 0; i < btns.length; i++) {
      if (on) btns[i].classList.add("speaking");
      else btns[i].classList.remove("speaking");
    }
  }

  function speakNow(text) {
    if (!speech.supported) return;
    try {
      var token = ++speech.talk;          /* the newest word owns the voice */
      var synth = window.speechSynthesis;
      var u = new window.SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.85;      /* a little slower, easier to copy */
      u.pitch = 1;
      u.volume = 1;
      if (speech.voice) u.voice = speech.voice;
      u.onstart = function () { if (token === speech.talk) setSpeakingUI(true); };
      u.onend = function () { if (token === speech.talk) setSpeakingUI(false); };
      u.onerror = function () { if (token === speech.talk) setSpeakingUI(false); };

      var play = function () {
        if (token !== speech.talk) return;  /* a newer word already took over */
        try { synth.speak(u); } catch (e) { /* blocked — the button still works */ }
      };
      setSpeakingUI(false);
      if (synth.speaking || synth.pending) {
        try { synth.cancel(); } catch (e) {}
        setTimeout(play, 90);   /* Chrome drops speak() right after cancel() */
      } else {
        play();
      }
    } catch (e) { /* never let audio break the activity */ }
  }

  /* What should be read out for a question.
     Normally that is the word itself, but a question may carry a "say"
     field to change ONLY the pronunciation — the word shown on screen
     still comes from "word". For example spelling the sound out:
         { image: "🏠", word: "live", say: "liv", chinese: "住" }
     Add a "say" line to any question whose word is read out wrongly. */
  function spokenText(q) {
    if (!q) return "";
    if (typeof q.say === "string" && q.say.trim()) return q.say.trim();
    return String(q.word == null ? "" : q.word);
  }

  /* Say a word. If the voice list is still loading we wait for it,
     but never longer than 400ms — silence would be worse. */
  function speakWord(word) {
    if (!speech.supported) return;
    var text = String(word == null ? "" : word).trim();
    if (!text) return;
    var mine = ++speech.seq;                     /* newest word wins */
    if (speech.ready) { speakNow(text); return; }
    var done = false;
    var go = function () {
      if (done || mine !== speech.seq) return;   /* a newer word took over */
      done = true;
      speakNow(text);
    };
    speech.waiting.push(go);
    refreshVoices();
    setTimeout(go, 400);
  }

  /* the 🔊 replay button — drawn inside the question card, in its
     top-right corner (see the .speak-btn styles). */
  function speakButtonHTML() {
    if (!speech.supported) return "";   /* no speech on this browser → no dead button */
    return '<button type="button" class="speak-btn" data-act="speak" ' +
           'aria-label="Hear the word" title="Hear the word">🔊</button>';
  }

  /* ---------- app state ---------- */
  var state = { screen: "home", topicId: null, levelIndex: 0, practiceTotal: 0,

  var session = null; /* everything about the level currently being played */

  /* The three activities of every level. "label" is the short tab text,

  var ACTIVITIES = [
    { label: "Choose", heading: "Choose the correct word" },

    { label: "Spell", heading: "Type the word" }
  ];

  /* ==================================================================
     FUN STUFF — these lists are easy to edit.
     Add or change any line and the app picks from them at random.
     The chosen line is shown in the feedback text under the question.
     ================================================================== */

  /* shown when the answer is right */
  var PRAISE = [

    "High five! ✋",

  ];

  /* Fallback stickers, used only for a level that has no "sticker" line of
     its own in vocabularyData. Add a sticker to the level in the data and
     that one is used instead. */
  var FALLBACK_STICKERS = ["🎁", "🎈", "🏆", "⭐", "🌟", "🎉", "🍭", "🎨", "🧩", "🔮", "🎯", "🚀"];

  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  /* one random line for the feedback text under the question */

  function encourageText() { return pick(ENCOURAGE); }

  /* ==================================================================
     STICKERS — one per level, worked out from vocabularyData.
     The sticker book therefore grows by itself when a new topic or level
     is added; nothing here is hard-coded.
     ================================================================== */

  /* the sticker that belongs to one level */
  function stickerFor(level, levelIndex) {
    if (level && level.sticker) return level.sticker;   /* set in the data */
    return FALLBACK_STICKERS[levelIndex % FALLBACK_STICKERS.length];
  }

  /* has this level's sticker been won? (saved as "topicId/levelId") */
  function isStickerEarned(topicId, levelId) {
    if (progress.stickers && progress.stickers[levelKey(topicId, levelId)]) return true;
    return isLevelDone(topicId, levelId);   /* levels finished before stickers existed */
  }

  /* mark this level's sticker as won */
  function awardLevelSticker(topicId, levelId) {
    if (!progress.stickers || typeof progress.stickers !== "object") progress.stickers = {};
    progress.stickers[levelKey(topicId, levelId)] = true;
    saveProgress();
  }

  /* how many stickers there are in total, and how many are won */
  function stickersTotal() {
    var n = 0;
    vocabularyData.topics.forEach(function (t) { n += (t.levels || []).length; });
    return n;
  }
  function stickersEarned() {
    var n = 0;
    vocabularyData.topics.forEach(function (t) {
      (t.levels || []).forEach(function (l) { if (isStickerEarned(t.id, l.id)) n++; });
    });
    return n;
  }

  var FALLBACK_WORDS = ["apple", "water", "happy", "green", "house", "music", "table", "river", "smile", "light"];

  /* ---------- look-ups ---------- */
  function findTopic(id) {
    for (var i = 0; i < vocabularyData.topics.length; i++) {
      if (vocabularyData.topics[i].id === id) return vocabularyData.topics[i];
    }
    return null;
  }
  /* ---------- the order of the questions ----------
     Every stage remembers its OWN shuffled order and its own place in it,
     so Stage 1, 2 and 3 can each show the words in a different order.
     The order is made the first time a stage is opened and then kept until
     the level is left and entered again. */
  function orderFor(activity) { return (session.orders && session.orders[activity]) || []; }
  function currentOrder() { return orderFor(session.activity); }
  function here() { return session.qIndexes[session.activity] || 0; }   /* place in this stage */
  function questionCount() { return (session.level.questions || []).length; }

  /* shuffle this stage's questions the first time it is opened */
  function ensureOrder(activity) {
    if (!session.orders) session.orders = [[], [], []];
    if (!session.orders[activity] || !session.orders[activity].length) {
      session.orders[activity] = shuffle((session.level.questions || []).slice());
    }
    return session.orders[activity];
  }

  function currentQuestion() { return currentOrder()[here()]; }

  /* ================= VIEWS ================= */

  function viewHome() {
    var totalLevels = 0, doneLevels = 0;
    vocabularyData.topics.forEach(function (t) {
      (t.levels || []).forEach(function (l) {
        totalLevels++;

    });

    var stickerCount = stickersEarned();
    return '' +
      '<div class="hero">' +
        '<div class="hero-emoji">📚</div>' +

        '<button class="btn primary big" data-act="go-topics">Vocabulary</button>' +
        '<div class="home-extra">' +

          '<button class="btn soft" data-act="tricky">🔁 Tricky Words (' + trickyCount() + ')</button>' +
          /* the word bank button — pick words and practise them */
          '<button class="btn soft" data-act="open-mywords">📖 Dictionary</button>' +

  /* ---------- the sticker book ----------

  function viewStickers() {

                 '<span class="sticker-emoji">' + (got ? stickerFor(l, i) : "❓") + '</span>' +

  function viewTopics() {

      return '<div class="card"><p class="empty">No topics yet.<br>Open this file in a text editor and add one to <b>vocabularyData</b>.</p></div>';
    }

  function viewLevels() {
    var topic = findTopic(state.topicId);
    if (!topic) { state.screen = "topics"; return viewTopics(); }
    var levels = topic.levels || [];
    var rows = levels.map(function (l, i) {
      var unlocked = isLevelUnlocked(topic, i);
      var rec = getLevelRecord(topic.id, l.id);
      var completed = !!(rec && rec.completed);
      var inProgress = !completed && hasResume(topic.id, l.id);
      var count = (l.questions || []).length;

      /* NO stars on this page. A finished level simply shows no icon at all;
         locked levels keep the padlock and open levels keep the play arrow.
         (Stars still appear on the "Level complete!" screen.) */
      var end;
      if (!unlocked) end = '<span class="chev">🔒</span>';
      else if (completed) end = "";
      else end = '<span class="chev">▶</span>';

      return '' +
        '<button class="level-card" data-act="open-level" data-topic="' + esc(topic.id) + '" data-index="' + i + '"' +
          (unlocked ? "" : " disabled") + '>' +

    return '' +

  function viewComplete() {

  /* ==================================================================
     DICTIONARY  —  look a word up, and the learner's own list
     ------------------------------------------------------------------
     One page, two views:
        "search"  the search box and its RESULTS. The results are temporary:
                  they exist only while something is typed, and a word that
                  has been added drops out of them.
        "mine"    the learner's saved words — the only place they are shown —
                  with a 🗑️ to remove one and the Practice button.
     Nothing from the word bank is ever listed here on its own: it is only
     read silently while searching.
     ================================================================== */
  var DICT_MAX = 50;          /* how many results are drawn at once */

  function viewMyWords() {
    var mine = myWordsList();
    var query = String(state.dictQuery || "");
    var view = state.dictView === "mine" ? "mine" : "search";

    var notice = state.dictNotice;
    var noticeHTML = notice ? '<p class="mw-notice ' + esc(notice.kind) + '">' + esc(notice.text) + '</p>' : "";

    /* ---- the two views ---- */
    var body = "";

    if (view === "mine") {
      /* the learner's saved words */
      var rows = mine.map(function (e) {
        return '<div class="mw-row">' +
          '<div class="mw-own">' +
            '<span class="mw-emoji">' + esc(e.image || "❓") + '</span>' +
            '<span class="mw-txt"><b>' + esc(e.word) + '</b><span>' + esc(e.chinese) + '</span></span>' +
            '<button type="button" class="mw-del" data-act="mywords-remove"' +
              ' data-word="' + esc(e.word) + '" data-chinese="' + esc(e.chinese) + '"' +
              ' aria-label="Delete ' + esc(e.word) + '" title="Delete this word">🗑️</button>' +
          '</div>' +
        '</div>';
      }).join("");
      body =
        '<p class="mw-count">' + mine.length + ' word' + (mine.length === 1 ? "" : "s") + ' in My Words</p>' +
        (mine.length
          ? '<div class="mw-list">' + rows + '</div>'
          : '<p class="empty">No words saved yet.</p>') +
        '<div class="mw-actions">' +
          '<button class="btn primary" data-act="practise-mywords"' + (mine.length ? "" : " disabled") + '>' +
            '▶ Practise My Words' + (mine.length ? " (" + mine.length + ")" : "") + '</button>' +
        '</div>';
    } else {
      /* the search results — temporary, and only while something is typed */
      if (!query.trim()) {
        body = '<p class="empty">Type a word to look it up.</p>';
      } else {
        var found = findWordsByPrefix(query);
        var fresh = found.filter(function (m) { return !isMyWord(m.word, m.chinese); });
        var shown = fresh.slice(0, DICT_MAX);
        var hidden = fresh.length - shown.length;

        if (!found.length) {
          body = '<p class="empty">No word found. Try another spelling!</p>';
        } else if (!fresh.length) {
          body = '<p class="empty">Every match is already in My Words.</p>';
        } else {
          body =
            '<div class="mw-list">' + shown.map(function (m) {
              return '<div class="mw-row">' +
                '<div class="mw-own">' +
                  '<span class="mw-emoji">' + esc(m.image || "❓") + '</span>' +
                  '<span class="mw-txt"><b>' + esc(m.word) + '</b><span>' + esc(m.chinese) + '</span></span>' +
                  '<button type="button" class="btn soft small" data-act="dict-add"' +
                    ' data-word="' + esc(m.word) + '"' +
                    ' data-chinese="' + esc(m.chinese) + '"' +
                    ' data-image="' + esc(m.image || "") + '"' +
                    ' data-say="' + esc(m.say || "") + '">Add</button>' +
                '</div>' +
              '</div>';
            }).join("") + '</div>' +
            (hidden > 0 ? '<p class="mw-count">Showing the first ' + shown.length + ' results</p>' : '');
        }
      }
    }

    return '' +
      '<div class="topbar">' +
        '<button class="icon-btn" data-act="home" aria-label="Home">←</button>' +
        '<div class="topbar-title"><span class="tt-main">📖 Dictionary</span></div>' +
        '<button class="icon-btn" data-act="toggle-sound" aria-label="Sound">' + (progress.settings.sound ? "🔊" : "🔇") + '</button>' +
      '</div>' +
      '<div class="card">' +
        /* the search box, with the My Words box beside it */
        '<div class="mw-add">' +
          '<input id="mwAdd" class="mw-search" type="text" autocomplete="off" autocorrect="off" ' +
            'autocapitalize="off" spellcheck="false" enterkeyhint="search" ' +
            'placeholder="Type a word" value="' + esc(query) + '" />' +
          '<button class="btn ' + (view === "mine" ? "primary" : "soft") + '" data-act="dict-view">' +
            (view === "mine" ? "🔎 Search" : "📒 My Words (" + mine.length + ")") +
          '</button>' +
        '</div>' +
        noticeHTML +
        body +
        '<div class="mw-actions">' +
          '<button class="btn ghost small" data-act="home">Back to the home screen</button>' +
        '</div>' +
      '</div>';
  }

  /* shown when a "Practise My Words" round is finished */
  function viewPracticeDone() {
    return '' +
      '<div class="card">' +
        '<div class="done-hero">' +
          '<div class="done-emoji">📒</div>' +
          '<h2>My Words practised!</h2>' +
          '<p>You went through all ' + (state.practiceTotal || 0) + ' word' + ((state.practiceTotal || 0) === 1 ? "" : "s") +
            ' three ways — choosing, arranging and spelling. 🎉</p>' +
        '</div>' +
        '<div class="done-actions">' +
          '<button class="btn primary" data-act="open-mywords" data-view="mine">Back to My Words →</button>' +
          '<button class="btn ghost" data-act="home">Home</button>' +
        '</div>' +
      '</div>';
  }

  function render() {
    var html = "";
    if (state.screen === "home") html = viewHome();
    else if (state.screen === "stickers") html = viewStickers();
    else if (state.screen === "topics") html = viewTopics();
    else if (state.screen === "levels") html = viewLevels();
    else if (state.screen === "learn") html = viewLearn();
    else if (state.screen === "complete") html = viewComplete();
    else if (state.screen === "reviewDone") html = viewReviewDone();
    else if (state.screen === "reviewEmpty") html = viewReviewEmpty();
    else if (state.screen === "myWords") html = viewMyWords();
    else if (state.screen === "practiceDone") html = viewPracticeDone();
    appEl.innerHTML = html;
    try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
    afterRender();
  }

  function afterRender() {
    if (state.screen === "myWords") {
      /* the search box looks the word up again on every keystroke, so the
         results keep up with the typing. The text lives in state, and the
         cursor is put back at the end after each redraw. */
      var searchBox = document.getElementById("mwAdd");
      if (searchBox) {
        searchBox.addEventListener("input", function (e) {
          state.dictQuery = e.target.value;
          state.dictView = "search";         /* typing always shows results */
          state.dictNotice = null;
          render();
          var again = document.getElementById("mwAdd");
          if (again) {
            try { again.focus({ preventScroll: true }); } catch (err) { again.focus(); }
            if (again.setSelectionRange) again.setSelectionRange(again.value.length, again.value.length);
          }
        });
        searchBox.addEventListener("keydown", function (e) {
          if (e.key === "Enter") e.preventDefault();   /* results are already live */
        });
      }
    }
    if (state.screen === "learn" && session) {
      setSpeakingUI(speech.speaking);   /* keep the pulse on if it is still talking */
      if (session.activity === 1) paintArrange();
      if (session.activity === 2) {
        paintTypeSlots();
        var inp = document.getElementById("typeInput");
        if (inp) {
          inp.addEventListener("input", onTypeInput);
          inp.addEventListener("keydown", function (e) {
            if (e.key === "Enter") e.preventDefault();
            if (e.key === "Backspace") playTone("backspace");   /* descending tone */
          });
          setTimeout(function () {
            try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); }
          }, 60);
        }
      }
    }
  }

  /* ================= LEVEL FLOW ================= */

  /* ---------- remembering where the learner stopped ---------- */
  /* Saved per level: which stage, where they were in each stage, and which
     WORDS were answered right first time. The score follows the word, not
     the position, so a fresh shuffle cannot mix the marks up.
     The shuffled orders are deliberately NOT saved: coming back to a level
     always shuffles all three stages again. */
  function saveResume() {
    if (!session || !session.orders || !session.orders.length) return;
    if (listSession()) return;    /* a review / practice session is never remembered */
    if (session.finished && session.finished[2]) return;   /* Spell done = level already complete */
    if (!progress.resume) progress.resume = {};
    progress.resume[levelKey(session.topicId, session.level.id)] = {
      activity: session.activity,
      qIndexes: session.qIndexes,
      marks: session.marks,
      finished: session.finished,
      updated: Date.now()
    };
    saveProgress();
  }

  function clearResume() {
    if (!session) return;
    if (progress.resume) delete progress.resume[levelKey(session.topicId, session.level.id)];
    saveProgress();
  }

  function hasResume(topicId, levelId) {
    return !!(progress.resume && progress.resume[levelKey(topicId, levelId)]);
  }

  /* Rebuild a saved position — the stage, the place in each stage and the
     words already scored. The orders stay empty, so every stage shuffles
     again the first time it is opened. */
  function applyResume(fresh) {
    var saved = progress.resume && progress.resume[levelKey(fresh.topicId, fresh.level.id)];
    if (!saved) return false;
    var n = fresh.level.questions.length, i, a;

    var byWord = {};
    fresh.level.questions.forEach(function (q) { byWord[norm(q.word)] = q; });

    /* keep only marks for words this level still has */
    var marks = [];
    for (a = 0; a < 3; a++) {
      var src = (saved.marks && saved.marks[a]) || {};
      var one = {};
      for (var w in src) if (src[w] && byWord[norm(w)]) one[norm(w)] = true;
      marks.push(one);
    }
    var fin = saved.finished || [];
    var finished = [!!fin[0], !!fin[1], !!fin[2]];
    if (finished[2]) return false;          /* level already completed via Spell — start fresh */

    var activity = parseInt(saved.activity, 10);
    if (!(activity >= 0 && activity <= 2)) activity = 0;

    var qIndexes = [0, 0, 0];
    var savedIdx = saved.qIndexes || [];
    for (a = 0; a < 3; a++) {
      var idx = parseInt(savedIdx[a], 10);
      qIndexes[a] = (idx >= 0 && idx < n) ? idx : 0;
    }

    fresh.marks = marks;
    fresh.finished = finished;
    fresh.activity = activity;
    fresh.qIndexes = qIndexes;
    return true;
  }

  /* one point per question, for answering it right the first time.
     The score is kept against the word, so shuffling cannot lose it. */
  function markFirstTry() {
    var q = currentQuestion();
    if (!session || !session.marks[session.activity] || !q) return;
    session.marks[session.activity][norm(q.word)] = true;
    saveResume();
  }
  /* how many words of one stage were answered right the first time */
  function countMarks(a) {
    var list = (session.marks && session.marks[a]) || {}, n = 0;
    for (var w in list) if (list[w]) n++;
    return Math.min(n, questionCount());
  }

  function startLevel(topicId, levelIndex) {
    var topic = findTopic(topicId);
    if (!topic) return;
    var level = (topic.levels || [])[levelIndex];
    if (!level) return;
    var qs = (level.questions || []).slice();
    if (!qs.length) { toast("This level has no words yet."); return; }

    session = {
      topicId: topicId,
      topic: topic,
      level: level,
      levelIndex: levelIndex,
      /* one shuffled question order per stage — each is filled in the first
         time that stage is opened (see ensureOrder) */
      orders: [[], [], []],
      qIndexes: [0, 0, 0],  /* where the learner is in each stage */
      activity: 0,          /* 0 = choose, 1 = rearrange, 2 = spell */
      marks: [{}, {}, {}],   /* words answered right first time, per stage */
      finished: [false, false, false],
      summary: null,
      /* per question */
      qFirstTry: true,
      locked: false,
      solved: false,        /* true only while the current question is answered correctly */
      pending: null,        /* timer that moves to the next question */
      options: [],
      arr: null,
      typeValue: ""
    };
    var resumed = applyResume(session);   /* continue where the learner stopped */

    state.topicId = topicId;
    state.levelIndex = levelIndex;
    state.screen = "learn";
    beginQuestion();
    render();
    if (resumed) toast("▶ " + level.name + " — " + ACTIVITIES[session.activity].heading);
  }

  function beginQuestion() {
    ensureOrder(session.activity);   /* shuffle this stage's words the first time it opens */
    var q = currentQuestion();
    session.locked = false;
    session.solved = false;   /* nothing may advance until this question is answered right */
    session.qFirstTry = true;
    session.typeValue = "";
    if (session.activity === 0) session.options = buildOptions(q.word, session.topic, session.level);
    if (session.activity === 1) buildArrangeState(q);
    saveResume();        /* remember the stage + question for next time */
    speakWord(spokenText(q));   /* every new question is read out loud automatically */
  }

  /* three wrong-looking words + the right one, always 4 choices.
     The wrong ones come from the SAME LEVEL first, so the choices are all
     the same sort of word. Only when a level has too few words do we top
     up from the rest of the topic, and then from a built-in list.
     None of this depends on the shuffled order. */
  function buildOptions(correctWord, topic, level) {
    var seen = {}, sameLevel = [], rest = [], fallback = [];
    seen[norm(correctWord)] = true;
    function addTo(list, w) {
      var n = norm(w);
      if (!w || seen[n]) return;
      seen[n] = true;
      list.push(w);
    }
    /* 1st choice: other words from the SAME level (they look most alike).
       2nd choice: other words from the SAME topic — so a level that holds
       only one word ("hundred") still gets sensible company.
       3rd choice: the generic fallback words, only if the topic is tiny. */
    (level.questions || []).forEach(function (q) { addTo(sameLevel, q.word); });
    (topic.levels || []).forEach(function (l) {
      (l.questions || []).forEach(function (q) { addTo(rest, q.word); });
    });
    FALLBACK_WORDS.forEach(function (w) { addTo(fallback, w); });

    var picks = shuffle(sameLevel).slice(0, 3);
    if (picks.length < 3) picks = picks.concat(shuffle(rest).slice(0, 3 - picks.length));
    if (picks.length < 3) picks = picks.concat(shuffle(fallback).slice(0, 3 - picks.length));
    return shuffle([correctWord].concat(picks));
  }

  /* Short pause after a CORRECT answer, then the next question.
     The "solved" flag is the safety net: if a question has not been answered
     correctly, this does nothing at all, so a wrong answer can never move on.
     The timer is cancelled if the learner jumps to another stage first. */
  function scheduleAdvance(ms) {
    if (!session || !session.solved) return;   /* not answered correctly — stay put */
    clearTimeout(session.pending);
    session.pending = setTimeout(advance, ms);
  }
  function cancelPending() {
    if (session && session.pending) { clearTimeout(session.pending); session.pending = null; }
  }

  /* Next question. When a stage runs out of questions it is marked as
     finished, and we move on to a stage that is still unfinished.

     UNLOCKING RULE: Stage 3 ("Spell") is the one that finishes the level
     and unlocks the next one. Stages 1 and 2 on their own only move the
     learner on to the next stage — they never complete the level. */
  /* ==================================================================
     TRICKY WORDS REVIEW
     ------------------------------------------------------------------
     The very same three activities as a level, in the same order, but
     played over the saved tricky cards instead of a level:
       Stage 1 Choose -> Stage 2 Arrange -> Stage 3 Type
     Answering a word correctly takes it off the list straight away, so
     the review is finished as soon as the list is empty.
     Nothing here touches levels, unlocking, stickers or the saved resume
     position — the session carries review: true and everything special
     keys off that.
     ================================================================== */
  function startReview() {
    var cards = trickyQuestions();
    if (!cards.length) {                    /* nothing to review: friendly screen */
      session = null;
      state.screen = "reviewEmpty";
      render();
      return;
    }

    var picked = shuffle(cards);            /* a fresh order every time */
    /* a pretend topic + level, just so the learning screen has a title */
    var reviewTopic = {
      id: "tricky", name: "Tricky Words", icon: "🔁",
      levels: [{ id: "review", name: "Mistake review", questions: picked }]
    };

    session = {
      review: true,             /* <- every special rule keys off this flag */
      exitTo: "home",           /* leaving goes back to the home screen */
      topicId: "tricky",
      topic: reviewTopic,
      level: reviewTopic.levels[0],
      levelIndex: 0,
      orders: [[], [], []],
      qIndexes: [0, 0, 0],
      activity: 0,
      marks: [{}, {}, {}],
      finished: [false, false, false],
      summary: null,
      qFirstTry: true,
      locked: false,
      solved: false,
      pending: null,
      options: [],
      arr: null,
      typeValue: ""
    };

    state.screen = "learn";
    beginQuestion();
    render();
    toast("🔁 Tricky Words — " + picked.length + (picked.length === 1 ? " word" : " words") + " to review");
  }

  /* ==================================================================
     PRACTISE MY WORDS
     ------------------------------------------------------------------
     The same three activities again, this time over the words the learner
     picked out of the word bank. Nothing is removed or scored, and no
     level, sticker or resume position is touched — it is just practice.
     ================================================================== */
  function listSession() { return !!(session && (session.review || session.practice)); }

  function startPractice() {
    var cards = myWordsQuestions();
    if (!cards.length) { toast("Add a word to My Words first."); return; }

    var picked = shuffle(cards);
    var topic = {
      id: "mywords", name: "My Words", icon: "📒",
      levels: [{ id: "practice", name: "My own words", questions: picked }]
    };

    session = {
      practice: true,
      exitTo: "myWords",        /* leaving goes back to the My Words screen */
      topicId: "mywords",
      topic: topic,
      level: topic.levels[0],
      levelIndex: 0,
      orders: [[], [], []],
      qIndexes: [0, 0, 0],
      activity: 0,
      marks: [{}, {}, {}],
      finished: [false, false, false],
      summary: null,
      qFirstTry: true,
      locked: false,
      solved: false,
      pending: null,
      options: [],
      arr: null,
      typeValue: ""
    };

    state.practiceTotal = picked.length;
    state.screen = "learn";
    beginQuestion();
    render();
    toast("📒 My Words — " + picked.length + (picked.length === 1 ? " word" : " words") + " to practise");
  }

  function showReviewDone() {
    session = null;
    state.screen = "reviewDone";
    playTone("success");
    render();
  }

  /* Take a fresh copy of the tricky list for the session (used when the
     review goes round again because words came back). */
  function resetReviewCards() {
    var again = shuffle(trickyQuestions());
    session.level.questions = again;
    session.topic.levels[0].questions = again;
    session.finished = [false, false, false];
    session.qIndexes = [0, 0, 0];
    session.orders = [[], [], []];
    session.marks = [{}, {}, {}];
  }

  function advance() {
    if (!session || !session.orders) return;
    session.pending = null;

    /* ---- A SESSION OVER A CHOSEN LIST ----
       Tricky Words review or My Words practice. There is no level to save
       here. The session always plays the SAME three activities as a level —
       Choose, then Arrange, then Type — over the cards it started with. */
    if (listSession()) {
      session.qIndexes[session.activity]++;
      if (session.qIndexes[session.activity] < currentOrder().length) {
        beginQuestion();
        render();
        return;
      }
      var doneStage = session.activity;
      session.finished[doneStage] = true;

      /* move on to the next activity that has not been played yet */
      var nextReviewStage = -1;
      for (var rs = 1; rs <= 3; rs++) {
        var rc = (doneStage + rs) % 3;
        if (!session.finished[rc]) { nextReviewStage = rc; break; }
      }
      if (nextReviewStage !== -1) {
        session.activity = nextReviewStage;
        session.qIndexes[nextReviewStage] = 0;
        beginQuestion();
        render();
        toast("✅ " + ACTIVITIES[doneStage].label + " done — next: " + ACTIVITIES[nextReviewStage].label);
        return;
      }

      /* all three activities have been played */
      if (session.practice) {                 /* My Words: that is the whole session */
        state.practiceTotal = session.level.questions.length;
        session = null;
        state.screen = "practiceDone";
        playTone("success");
        render();
        return;
      }
      if (!trickyCount()) { showReviewDone(); return; }   /* every tricky word cleared! */

      /* Some tricky words came back (they were missed in the last activity),
         so take a fresh copy of the list and go round again. */
      resetReviewCards();
      session.activity = 0;
      beginQuestion();
      render();
      toast("💪 " + trickyCount() + " word" + (trickyCount() === 1 ? "" : "s") + " still tricky — let's go again!");
      return;
    }

    session.qIndexes[session.activity]++;          /* move on inside this stage only */
    if (session.qIndexes[session.activity] < currentOrder().length) {
      beginQuestion();
      render();
      return;
    }

    var justFinished = session.activity;
    session.finished[justFinished] = true;

    /* Stage 3 done -> the level is complete and the next level unlocks.
       (The three-way check is only a safety net in case the stage order
       is ever changed; with the rule above it is never needed.) */
    if (justFinished === 2 || (session.finished[0] && session.finished[1] && session.finished[2])) {
      finishLevel();
      return;
    }

    var next = -1;
    for (var step = 1; step <= 3; step++) {
      var cand = (justFinished + step) % 3;
      if (!session.finished[cand]) { next = cand; break; }
    }
    if (next === -1) { finishLevel(); return; }

    session.activity = next;
    /* that stage keeps whatever place it already had (0 if never opened) */
    session.qIndexes[next] = session.qIndexes[next] || 0;
    beginQuestion();
    render();
    toast("✅ " + ACTIVITIES[justFinished].label + " done — next: " + ACTIVITIES[next].label);
  }

  function finishLevel() {
    var total = questionCount();
    var per = [countMarks(0), countMarks(1), countMarks(2)];
    var correct = per[0] + per[1] + per[2];
    var grand = total * 3;
    var pct = grand ? correct / grand : 0;

    /* save + unlock, and forget the half-finished position */
    var key = levelKey(session.topicId, session.level.id);
    var prev = progress.levels[key] || {};
    progress.levels[key] = {
      completed: true,
      bestCorrect: Math.max(prev.bestCorrect || 0, correct),
      total: total,
      plays: (prev.plays || 0) + 1,
      updated: Date.now()
    };
    if (progress.resume) delete progress.resume[key];
    /* win this level's own sticker and remember it as "topicId/levelId" */
    var won = stickerFor(session.level, session.levelIndex);
    awardLevelSticker(session.topicId, session.level.id);

    session.summary = {
      topic: session.topic,
      level: session.level,
      levelIndex: session.levelIndex,
      levelCount: (session.topic.levels || []).length,
      total: total,
      perActivity: per,
      correct: correct,
      finished: session.finished.slice(),   /* which stages were actually played */
      sticker: won,                         /* the sticker just won */
      stars: starsFor(pct)
    };
    state.screen = "complete";
    playTone("success");
    render();
    toast("🔓 Level saved! Next level unlocked.");
  }

  /* Leaving is harmless now — the position is remembered. */
  function leaveLevel() {
    cancelPending();       /* never let a half-finished answer move on */
    if (listSession()) {   /* a review / practice has nothing to remember */
      var back = session.exitTo || "home";
      session = null;
      state.screen = back;
      render();
      return;
    }
    saveResume();
    session = null;
    state.screen = "levels";
    render();
  }

  /* ================= ACTIVITY A ================= */
  /* The word buttons change COLOUR, exactly like Stage 2 and Stage 3 do:
     green for the right word, red for a wrong one. No tick and no cross.
     Correct choice -> green, then the next question after a short pause.
     Wrong choice   -> red, and we STAY on this question so the learner can
     try another word; the red stays until the right word is clicked. */
  function answerChoice(btn) {
    if (!session || session.locked || session.activity !== 0) return;
    if (!btn || btn.disabled) return;

    var q = currentQuestion();
    var right = norm(btn.getAttribute("data-word")) === norm(q.word);

    if (!right) {
      /* ---- wrong: turn this button red and wait for another try ---- */
      session.qFirstTry = false;             /* it no longer counts as first try */
      markTricky();                          /* remember the word for review */
      btn.classList.add("bad");
      /* a random encouraging line goes in the feedback text below the question */
      playTone("wrong");
      feedback("bad", encourageText());
      return;                                /* never move on from a wrong answer */
    }

    /* ---- correct: turn it green, then move on ---- */
    session.locked = true;                   /* stops any further clicks here */
    session.solved = true;                   /* only a solved question may advance */
    if (session.qFirstTry) markFirstTry();   /* wrong tries earlier cost the point */
    solvedTricky();                          /* in review mode the word is now cleared */
    btn.classList.add("good");
    playTone("correct");
    /* a random praise line goes in the feedback text below the question */
    feedback("good", praiseText());
    scheduleAdvance(850);
  }

  /* ================= ACTIVITY B ================= */
  function buildArrangeState(q) {
    /* the whole answer, spaces included: "Hong Kong" -> "Hong Kong" */
    var answer = answerOf(q);
    var letters = lettersOf(answer);          /* "HongKong" — the tiles        */

    /* where the fixed spaces sit, and which positions the learner fills in */
    var places = [];                          /* places[k] = position of blank k */
    var wordGroups = [];                      /* one list of positions per word  */
    var cur = null, i;
    for (i = 0; i < answer.length; i++) {
      if (answer.charAt(i) === " ") { cur = null; continue; }   /* a fixed space */
      if (!cur) { cur = []; wordGroups.push(cur); }
      cur.push(i);
      places.push(i);
    }

    /* The tiles: one group per word, shuffled inside, and the groups
       themselves shuffled, so the order of the words is not given away and
       the letters of a word can never be split over two rows. */
    var pool = [], poolGroups = [], nextId = 0;
    var order = shuffle(wordsOf(answer).map(function (_, wi) { return wi; }));
    order.forEach(function (wi) {
      var ids = [];
      shuffle(wordsOf(answer)[wi].split("")).forEach(function (ch) {
        pool.push({ ch: ch, id: nextId });
        ids.push(nextId);
        nextId++;
      });
      poolGroups.push(ids);
    });

    session.arr = {
      word: answer,          /* the full answer, spaces included  */
      letters: letters,      /* just the characters (no spaces)   */
      places: places,        /* which position each blank belongs to */
      wordGroups: wordGroups,/* the positions of each word        */
      pool: pool,
      poolGroups: poolGroups,
      chosen: [],
      locked: false,
      tries: 0
    };
  }

  /* the letter the learner put in blank k (0 = first blank), or "" */
  function chosenChar(a, k) {
    var id = a.chosen[k];
    if (id == null) return "";
    for (var i = 0; i < a.pool.length; i++) if (a.pool[i].id === id) return a.pool[i].ch;
    return "";
  }

  function paintArrange() {
    if (!session || !session.arr) return;
    var slotsEl = document.getElementById("arrSlots");
    var tilesEl = document.getElementById("arrTiles");
    if (!slotsEl || !tilesEl) return;
    var a = session.arr;

    /* ---- the answer the learner is building ----
       one .word-group per word (so a word never breaks over two rows) and a
       fixed gap between the words. The gap is drawn at the END of a word
       group, so it travels with the word if the word wraps. */
    slotsEl.innerHTML = a.wordGroups.map(function (positions, wi) {
      var inner = positions.map(function (pos) {
        var ch = chosenChar(a, a.places.indexOf(pos));
        return '<span class="slot' + (ch ? " filled" : "") + '">' + (ch ? esc(ch) : "_") + '</span>';
      }).join("");
      if (wi < a.wordGroups.length - 1) {
        inner += '<span class="slot space" aria-hidden="true">&nbsp;</span>';
      }
      return '<div class="word-group">' + inner + '</div>';
    }).join("");

    /* ---- the letter tiles, grouped by word in the same way ---- */
    tilesEl.innerHTML = a.poolGroups.map(function (ids) {
      var group = ids.map(function (id) {
        var ch = "", used = a.chosen.indexOf(id) !== -1, k;
        for (k = 0; k < a.pool.length; k++) if (a.pool[k].id === id) ch = a.pool[k].ch;
        return '<button class="tile' + (used ? " used" : "") + '" data-act="tile" data-id="' + id + '"' +
          (used ? " disabled" : "") + '>' + esc(ch) + '</button>';
      }).join("");
      return '<div class="tile-group">' + group + '</div>';
    }).join("");
  }

  function tapTile(id) {
    if (!session || !session.arr || session.arr.locked) return;
    var a = session.arr;
    if (a.chosen.indexOf(id) !== -1) return;
    a.chosen.push(id);
    playTone("tile");
    paintArrange();
    if (a.chosen.length === a.letters.length) checkArrange();
  }

  function checkArrange() {
    var a = session.arr;
    if (a.locked) return;
    var letters = a.chosen.map(function (id) {
      for (var k = 0; k < a.pool.length; k++) if (a.pool[k].id === id) return a.pool[k].ch;
      return "";
    }).join("");
    /* put the word spaces back in their fixed places before comparing */
    var built = withSpaces(a.word, letters);

    if (norm(built) === norm(a.word)) {
      a.locked = true;
      session.solved = true;               /* only now may we move on */
      if (session.qFirstTry) markFirstTry();
      solvedTricky();                      /* in review mode the word is now cleared */
      var slotsEl = document.getElementById("arrSlots");
      if (slotsEl) slotsEl.classList.add("good");
      var tilesEl = document.getElementById("arrTiles");
      if (tilesEl) tilesEl.style.visibility = "hidden";
      /* a random praise line goes in the feedback text below the question */
      playTone("correct");
      feedback("good", praiseText());
      scheduleAdvance(850);
    } else {
      /* ---- wrong: show the error, clear the letters, stay on this question ---- */
      a.locked = true;
      session.qFirstTry = false;
      markTricky();                        /* remember the word for review */
      a.tries++;
      /* a random encouraging line goes in the feedback text below the question */
      playTone("wrong");
      var sl = document.getElementById("arrSlots");
      if (sl) { sl.classList.add("bad", "shake"); }
      feedback("bad", encourageText());
      setTimeout(function () {
        var el = document.getElementById("arrSlots");
        if (el) el.classList.remove("bad", "shake");
        a.chosen = [];
        a.locked = false;
        paintArrange();
        if (a.tries >= 2) feedback("hint", "Hint: the word starts with “" + a.word.charAt(0) + "”");
        else feedback("", "");
      }, 800);
    }
  }

  function undoArrange() {
    if (!session || !session.arr || session.arr.locked) return;
    playTone("backspace");
    session.arr.chosen.pop();
    paintArrange();
  }
  function clearArrange() {
    if (!session || !session.arr || session.arr.locked) return;
    playTone("backspace");
    session.arr.chosen = [];
    paintArrange();
  }

  /* ================= ACTIVITY C ================= */
  function paintTypeSlots() {
    if (!session || session.activity !== 2) return;
    var slotsEl = document.getElementById("typeSlots");
    if (!slotsEl) return;
    var q = currentQuestion();
    var answer = answerOf(q);                 /* spaces kept: "Hong Kong" */
    var groups = wordsOf(answer);             /* ["Hong", "Kong"]        */
    var typed = session.typeValue || "";      /* letters only            */
    var t = 0;                                /* how many letters are typed */

    /* one .word-group per word: the letters of a word stay together on one
       row, and the space between the words is drawn as a fixed gap that is
       already filled in — the learner only types the letters. */
    slotsEl.innerHTML = groups.map(function (w, wi) {
      var inner = "";
      for (var i = 0; i < w.length; i++) {
        var ch = typed.charAt(t);
        t++;
        inner += '<span class="slot' + (ch ? " filled" : "") + '">' + (ch ? esc(ch) : "_") + '</span>';
      }
      if (wi < groups.length - 1) {
        inner += '<span class="slot space" aria-hidden="true">&nbsp;</span>';
      }
      return '<div class="word-group">' + inner + '</div>';
    }).join("");

    var inp = document.getElementById("typeInput");
    /* the learner types letters only, so the limit is the letters, not the
       spaces */
    if (inp) inp.maxLength = lettersOf(answer).length;
  }

  function onTypeInput(e) {
    if (!session || session.activity !== 2) return;
    var inp = e.target;
    if (session.locked) return;              /* the question is already answered */
    var q = currentQuestion();
    var answer = answerOf(q);
    var need = lettersOf(answer).length;     /* letters only, spaces skipped */
    /* a spacebar press is simply ignored: the app knows where the spaces go */
    var v = String(inp.value).replace(LETTERS_ONLY, "").slice(0, need);
    if (inp.value !== v) inp.value = v;
    session.typeValue = v;

    /* the learner is editing (usually Backspace) — clear the red error look */
    var slotsEl = document.getElementById("typeSlots");
    if (slotsEl) slotsEl.classList.remove("bad");
    var wrap = document.getElementById("typeWrap");
    if (wrap) wrap.classList.remove("shake");
    if (!session.solved) feedback("", "");

    paintTypeSlots();
    /* check only once every letter has been typed */
    if (v.length === need) checkType();
  }

  /* Only the auto-check decides this, and it runs when all blanks are filled. */
  function checkType() {
    if (!session || session.locked || session.activity !== 2) return;
    var q = currentQuestion();
    var answer = answerOf(q);
    var need = lettersOf(answer).length;
    var v = session.typeValue || "";
    if (v.length !== need) return;           /* not finished typing yet */

    /* the spaces go back into their fixed places before comparing, so the
       answer is judged as a whole phrase ("hong kong" == "Hong Kong") */
    if (norm(withSpaces(answer, v)) === norm(answer)) {
      /* ---- correct: green, then the next question ---- */
      session.locked = true;
      session.solved = true;                 /* only now may we move on */
      if (session.qFirstTry) markFirstTry();
      solvedTricky();                        /* in review mode the word is now cleared */
      var slotsEl = document.getElementById("typeSlots");
      if (slotsEl) { slotsEl.classList.remove("bad", "shake"); slotsEl.classList.add("good"); }
      var inp = document.getElementById("typeInput");
      if (inp) inp.blur();
      /* a random praise line goes in the feedback text below the question */
      playTone("correct");
      feedback("good", praiseText());
      scheduleAdvance(900);
      return;
    }

    /* ---- wrong: go red, keep the letters, and stay on this question ----
       The letters are left in place so the learner can press Backspace
       and fix them; nothing here ever moves to the next question. */
    session.qFirstTry = false;
    markTricky();                          /* remember the word for review */
    playTone("wrong");
    var sl = document.getElementById("typeSlots");
    if (sl) { sl.classList.remove("good"); sl.classList.add("bad"); }
    var wrap = document.getElementById("typeWrap");
    if (wrap) wrap.classList.add("shake");
    /* a random encouraging line goes in the feedback text below the question */
    feedback("bad", encourageText());
  }

  /* ================= shared bits ================= */
  function feedback(kind, msg) {
    var el = document.getElementById("feedback");
    if (!el) return;
    el.className = "feedback" + (kind ? " " + kind : "");
    el.textContent = msg || "";
  }

  /* ================= EVENTS ================= */
  appEl.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var act = btn.getAttribute("data-act");

    /* ---- which sound does this button make? ----
       correct / wrong / tile are played where the action happens,
       and the 🔊 button is deliberately silent (the voice is enough). */
    if (act === "go-activity") playTone("tab");                    /* stage tabs: soft click */
    else if (act === "answer" || act === "tile" || act === "speak" ||
             act === "undo" || act === "clear") { /* played where the action happens */ }
    else if (act !== "toggle-sound") playTone("click");            /* navigation: short click */

    if (act === "go-topics") { session = null; state.screen = "topics"; render(); return; }
    if (act === "go-stickers") { session = null; state.screen = "stickers"; render(); return; }
    if (act === "tricky") { startReview(); return; }
    if (act === "open-mywords") {
      session = null;
      state.dictQuery = "";
      /* comes back to whichever view the button asked for */
      state.dictView = btn.getAttribute("data-view") === "mine" ? "mine" : "search";
      state.dictNotice = null;
      state.screen = "myWords";
      render();
      return;
    }
    if (act === "dict-add") { addDictWord(btn); return; }
    if (act === "dict-view") {
      /* swap between the search results and the learner's own list */
      state.dictView = state.dictView === "mine" ? "search" : "mine";
      state.dictNotice = null;
      render();
      return;
    }
    if (act === "mywords-remove") {
      /* the 🗑️ on one of the learner's own words */
      var rmWord = btn.getAttribute("data-word");
      var rmChinese = btn.getAttribute("data-chinese");
      if (!rmWord) return;
      removeMyWord(rmWord, rmChinese);
      playTone("backspace");
      toast("Deleted “" + rmWord + "” from My Words");
      state.dictNotice = { kind: "dup", text: "Deleted “" + rmWord + "” (" + rmChinese + ") from My Words." };
      render();
      return;
    }
    if (act === "practise-mywords") { startPractice(); return; }
    if (act === "home") { session = null; state.screen = "home"; render(); return; }
    if (act === "open-topic") {
      state.topicId = btn.getAttribute("data-topic");
      state.screen = "levels";
      render();
      return;
    }
    if (act === "open-level") {
      startLevel(btn.getAttribute("data-topic"), parseInt(btn.getAttribute("data-index"), 10));
      return;
    }
    if (act === "exit-level") { leaveLevel(); return; }
    if (act === "go-activity") {
      /* tap a stage tab: that stage keeps its own shuffled order and its
         own place, so coming back lands where you left off */
      var idx = parseInt(btn.getAttribute("data-index"), 10);
      if (session && session.orders && !isNaN(idx) && idx >= 0 && idx <= 2 && idx !== session.activity) {
        cancelPending();          /* an answer still being celebrated must not move on */
        session.activity = idx;
        session.arr = null;
        ensureOrder(idx);         /* first visit to this stage shuffles it */
        if (session.qIndexes[idx] >= currentOrder().length) session.qIndexes[idx] = 0;
        beginQuestion();
        render();
      }
      return;
    }
    if (act === "answer") { answerChoice(btn); return; }
    if (act === "tile") { tapTile(parseInt(btn.getAttribute("data-id"), 10)); return; }
    if (act === "undo") { undoArrange(); return; }
    if (act === "clear") { clearArrange(); return; }
    if (act === "speak") {
      if (session && session.orders && currentQuestion()) {
        speakWord(spokenText(currentQuestion()));
        /* tapping 🔊 must not steal focus from the typing activity */
        if (session.activity === 2) {
          var box = document.getElementById("typeInput");
          if (box) { try { box.focus({ preventScroll: true }); } catch (e) { box.focus(); } }
        }
      }
      return;
    }
    if (act === "toggle-sound") {
      progress.settings.sound = !progress.settings.sound;
      saveProgress();
      if (progress.settings.sound) playTone("click");
      /* update every sound button on screen without losing the current question */
      var all = document.querySelectorAll('[data-act="toggle-sound"]');
      Array.prototype.forEach.call(all, function (b) {
        if (b.classList.contains("icon-btn")) b.textContent = progress.settings.sound ? "🔊" : "🔇";
        else b.textContent = progress.settings.sound ? "🔊 Sound on" : "🔇 Sound off";
      });
      return;
    }
    if (act === "next-level") {
      if (session && session.summary) startLevel(session.summary.topic.id, session.summary.levelIndex + 1);
      return;
    }
    if (act === "go-levels") {
      if (session && session.summary) state.topicId = session.summary.topic.id;
      session = null;
      state.screen = "levels";
      render();
      return;
    }
    if (act === "replay") {
      if (session && session.summary) startLevel(session.summary.topic.id, session.summary.levelIndex);
      return;
    }
  });

  /* number keys pick an answer in Activity A */
  document.addEventListener("keydown", function (e) {
    if (state.screen !== "learn" || !session || session.activity !== 0 || session.locked) return;
    var n = parseInt(e.key, 10);
    if (!n || n < 1 || n > 4) return;
    var buttons = document.querySelectorAll("#options .option");
    if (buttons[n - 1]) answerChoice(buttons[n - 1]);
  });

  /* ================= START ================= */
  startVoiceLoading();   /* read the voice list, and again when it finishes loading */
  render();
})();
</script>
</body>
</html>
