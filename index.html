<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vocabulary Trainer — Learn English Words</title>

<!-- ============================================================
     VOCABULARY TRAINER  —  one single file (HTML + CSS + JavaScript)
     No frameworks, no build step, no server. Just open index.html.
     Progress is saved in the browser with localStorage.
     ============================================================ -->

<style>
  /* ----------------------------- THEME ----------------------------- */
  :root{
    --bg1:#eef3ff;
    --bg2:#f7f0ff;
    --card:#ffffff;
    --ink:#1f2937;
    --muted:#6b7280;
    --primary:#5b6cff;
    --primary-dark:#4453d6;
    --green:#22c55e;
    --green-dark:#15803d;
    --red:#ef4444;
    --red-dark:#b91c1c;
    --amber:#f59e0b;
    --border:#e5e7eb;
    --radius:18px;
    --shadow:0 8px 24px rgba(31,41,55,.09);
  }

  *{ box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    margin:0;
    font-family: "Trebuchet MS", "Segoe UI", Roboto, system-ui, -apple-system, Arial, sans-serif;
    color:var(--ink);
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
    background-attachment: fixed;
    -webkit-text-size-adjust:100%;
  }

  .app{
    max-width: 880px;
    margin: 0 auto;
    padding: 18px 16px 60px;
  }

  /* Screens: only the one with .active is visible */
  .screen{ display:none; }
  .screen.active{ display:block; animation: fadeIn .25s ease; }

  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(6px); }
    to  { opacity:1; transform: none; }
  }

  /* ----------------------------- BUTTONS ----------------------------- */
  .btn{
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    padding: 14px 20px;
    cursor: pointer;
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 3px 0 rgba(31,41,55,.12);
    transition: transform .08s ease, background .15s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover{ transform: translateY(-1px); }
  .btn:active{ transform: translateY(1px); box-shadow: none; }
  .btn:focus-visible{ outline: 3px solid #b9c1ff; outline-offset: 2px; }

  .btn.primary{ background: var(--primary); color:#fff; box-shadow:0 4px 0 var(--primary-dark); }
  .btn.primary:hover{ background:#4a5bf0; }

  .btn.ghost{ background:#fff; border:2px solid var(--border); }

  .btn.big{ font-size:1.5rem; padding:20px 46px; border-radius:20px; }

  .btn.small{ font-size:.9rem; padding:9px 14px; border-radius:12px; }

  .btn.link{
    background:none; box-shadow:none; color:var(--muted);
    text-decoration: underline; font-size:.9rem; font-weight:600; padding:8px;
  }

  .btn:disabled{
    opacity:.55; cursor:not-allowed; transform:none; box-shadow:none;
  }

  /* ----------------------------- HOME ----------------------------- */
  .hero{
    text-align:center;
    padding: 60px 16px 40px;
  }
  .hero h1{
    font-size: clamp(1.9rem, 6vw, 3rem);
    margin: 0 0 10px;
    letter-spacing:-.5px;
  }
  .hero p{
    color: var(--muted);
    font-size: clamp(1rem, 3.6vw, 1.15rem);
    margin: 0 auto 30px;
    max-width: 520px;
    line-height:1.5;
  }
  .hero-buttons{
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .resume-note{
    background:#fff; border:2px dashed var(--primary);
    border-radius:14px; padding:12px 16px; font-size:.95rem;
    color:var(--muted); max-width: 460px;
  }
  .resume-note b{ color:var(--ink); }

  /* ----------------------------- PAGES ----------------------------- */
  .page-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; margin-bottom:18px;
  }
  .page-head h2{
    margin:0; font-size: clamp(1.3rem, 4.6vw, 1.8rem);
  }
  .page-sub{ color:var(--muted); font-size:.95rem; margin:-8px 0 18px; }

  /* Topic cards */
  .topic-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .topic-card{
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 14px;
    text-align:center;
    cursor:pointer;
    box-shadow: var(--shadow);
    transition: transform .1s ease, border-color .15s ease;
    font-family: inherit;
    font-size:1.05rem;
    font-weight:700;
    color:var(--ink);
    position:relative;
  }
  .topic-card:hover{ transform: translateY(-3px); border-color: var(--primary); }
  .topic-card .topic-emoji{ display:block; font-size:2.2rem; margin-bottom:8px; }
  .topic-card .topic-count{ display:block; font-size:.8rem; font-weight:600; color:var(--muted); margin-top:6px; }
  .topic-card .done-badge{
    position:absolute; top:8px; right:10px; font-size:1.1rem;
  }

  /* Level list */
  .level-list{ display:grid; gap:12px; }
  .level-card{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
    text-align:left;
    font-family:inherit;
    color:var(--ink);
    cursor:pointer;
    transition: transform .1s ease, border-color .15s ease;
    width:100%;
  }
  .level-card:hover:not(:disabled){ transform: translateY(-2px); border-color: var(--primary); }
  .level-card:disabled{
    cursor:not-allowed;
    background:#f4f5f7;
    color:#9aa1ac;
    box-shadow:none;
    opacity:.85;
  }
  .level-card .level-name{ font-size:1.15rem; font-weight:800; }
  .level-card .level-info{ font-size:.85rem; color:var(--muted); font-weight:600; margin-top:4px; }
  .level-card .level-state{ font-size:1.4rem; }
  .level-card.complete{ border-color: var(--green); }
  .level-card.complete .level-state{ color: var(--green-dark); }

  /* ----------------------------- LEARNING SCREEN ----------------------------- */
  .learn-top{
    background:var(--card);
    border-radius: var(--radius);
    padding:14px 16px;
    box-shadow: var(--shadow);
    margin-bottom:16px;
  }
  .learn-nav{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .progress-line{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:10px; flex-wrap:wrap;
    color:var(--muted); font-weight:700; font-size:.9rem;
  }
  .progress-line .level-tag{
    background:#eef1ff; color:var(--primary-dark);
    padding:4px 10px; border-radius:999px;
  }
  #learn-heading{
    margin:12px 0 0;
    font-size: clamp(1.15rem, 4.4vw, 1.5rem);
    color: var(--primary-dark);
  }

  .image-box{
    background:#fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding:16px;
    display:flex; align-items:center; justify-content:center;
    min-height: 190px;
    margin-bottom:18px;
  }
  .image-box img{
    max-width:100%;
    max-height: 230px;
    border-radius:12px;
    display:block;
  }
  .placeholder{
    text-align:center;
    color:var(--muted);
    padding: 12px;
  }
  .placeholder .ph-icon{ font-size:3rem; display:block; margin-bottom:8px; }
  .placeholder .ph-text{ font-size:.9rem; font-weight:700; }

  /* A big emoji used instead of a picture.
     clamp() means: at least 4.2rem, at most 9.5rem, and 22% of the screen
     width in between — so it looks big on a phone AND on a computer. */
  .emoji-face{
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji",
                 "EmojiOne Color", "Android Emoji", sans-serif;
    font-size: clamp(4.2rem, 22vw, 9.5rem);
    line-height: 1.15;
    text-align: center;
    display: block;
    padding: 6px 0;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Two or more emoji together (like 🍎🍊) need a smaller size, so they
     still fit side by side on a phone. */
  .emoji-face.many{
    font-size: clamp(2.2rem, 11vw, 4.6rem);
    letter-spacing: 2px;
  }

  /* A longer combination, like "🐘 vs 🐭", needs to be smaller again. */
  .emoji-face.lots{
    font-size: clamp(1.35rem, 6.6vw, 3rem);
    letter-spacing: 1px;
  }

  /* A short sentence used instead of a picture: big and centred, but a bit
     smaller than the emoji so the whole sentence fits on the screen. */
  .sentence-face{
    font-family: inherit;
    font-size: clamp(1.3rem, 5vw, 2.2rem);
    font-weight: 800;
    line-height: 1.4;
    color: var(--ink);
    text-align: center;
    display: block;
    max-width: 26ch;
    margin: 0 auto;
    padding: 10px 6px;
  }

  /* A picture from the internet (for example Pollinations.ai) can take a few
     seconds to be drawn, so we show a friendly note while we wait. */
  .web-image-box{
    width:100%;
    min-height:170px;
    display:flex; align-items:center; justify-content:center;
  }
  .image-loading{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    color:var(--muted); font-weight:700; text-align:center;
  }
  .image-loading-icon{ font-size:2.6rem; animation: blink 1.2s ease-in-out infinite; }
  .image-loading-text{ font-size:.95rem; }
  .web-image-box.ready .image-loading{ display:none; }
  .web-image{ max-width:100%; max-height:230px; border-radius:12px; display:block; }
  .web-image.pending{ display:none; }

  /* Activity A — word buttons */
  .word-buttons{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap:12px;
  }
  .word-btn{
    font-family:inherit;
    font-size:1.35rem;
    font-weight:800;
    padding:20px 12px;
    border-radius:16px;
    border:3px solid var(--border);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    box-shadow:0 4px 0 rgba(31,41,55,.1);
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
    position:relative;
  }
  .word-btn:hover:not(:disabled){ border-color: var(--primary); transform: translateY(-2px); }
  .word-btn:disabled{ cursor:default; }
  .word-btn.correct{
    background: var(--green); border-color: var(--green-dark); color:#fff;
  }
  .word-btn.wrong{
    background: var(--red); border-color: var(--red-dark); color:#fff;
  }
  .word-btn .mark{
    position:absolute; top:-12px; right:-10px;
    font-size:1.5rem; background:#fff; border-radius:50%;
    width:34px; height:34px; line-height:34px; text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
  }

  /* Activity B — letter tiles */
  .built-area{
    background:#fff;
    border:3px dashed var(--border);
    border-radius:16px;
    min-height: 78px;
    display:flex; align-items:center; justify-content:center;
    gap:8px; flex-wrap:wrap;
    padding:12px;
    margin-bottom:16px;
    transition: border-color .15s ease, background .15s ease;
  }
  .built-area.ok{ border-color: var(--green); background:#f0fdf4; }
  .built-area.bad{ border-color: var(--red); background:#fef2f2; animation: shake .35s ease; }
  .built-area .hint-text{ color:#b6bcc7; font-weight:700; }

  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-7px); }
    75%{ transform: translateX(7px); }
  }

  .tiles{
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center;
    margin-bottom:16px;
  }
  .tile{
    font-family:inherit;
    font-size:1.6rem;
    font-weight:800;
    min-width:56px;
    padding:12px 14px;
    border-radius:14px;
    border:3px solid #cfd6ff;
    background:#fff;
    color:var(--primary-dark);
    cursor:pointer;
    box-shadow:0 4px 0 #dfe4ff;
    transition: transform .08s ease, background .15s ease;
    text-transform: lowercase;
  }
  .tile:hover:not(:disabled){ background:#eef1ff; transform: translateY(-2px); }
  .tile.small-tile{ font-size:1.4rem; min-width:46px; padding:8px 12px; box-shadow:0 3px 0 #dfe4ff; }
  .tile:disabled{ opacity:.5; cursor:default; }

  .action-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  /* Activity C — type straight onto the blanks */
  .spell-slots{
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:center;
    gap: 8px 10px;
    background:#fff;
    border:3px solid var(--border);
    border-radius:16px;
    box-shadow: var(--shadow);
    padding: 16px 12px;
    margin-bottom: 14px;
    transition: border-color .15s ease, background .15s ease;
  }
  .spell-slots.ok{ border-color: var(--green); background:#f0fdf4; }
  .spell-slots.bad{ border-color: var(--red); background:#fef2f2; animation: shake .35s ease; }

  /* one box per letter of the word */
  .spell-slot{
    width: clamp(30px, 8.5vw, 48px);
    height: clamp(50px, 13vw, 68px);
    display:flex; align-items:flex-end; justify-content:center;
    font-size: clamp(2rem, 9vw, 3rem);
    font-weight: 800;
    line-height: 1;
    text-transform: lowercase;
    padding-bottom: 4px;
  }
  .spell-char{ color:#c3cad6; transition: color .12s ease; }   /* the underscore */
  .spell-slot.filled .spell-char{ color: var(--ink); }         /* a letter the learner typed */
  .spell-slot.hint .spell-char{ color: var(--primary); }       /* the free first letter */
  .spell-slot.next .spell-char{ animation: blink 1.1s steps(2, start) infinite; }
  .spell-slots.ok .spell-char{ color: var(--green-dark); }
  .spell-slots.bad .spell-char{ color: var(--red); }

  @keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }

  .type-hint{
    text-align:center; color:var(--muted); font-weight:700;
    font-size:.92rem; margin: -4px 0 12px;
  }

  /* The hidden box that catches the typing. Phones need a real text box to
     show their keyboard. It is 1 pixel big and pinned to the TOP of the page,
     so the keyboard never hides the picture or the blanks. */
  .type-catcher{
    position: fixed;
    top: 8px; left: 8px;
    width: 1px; height: 1px;
    padding:0; margin:0; border:0;
    opacity: 0.01;
    background: transparent;
    color: transparent;
    caret-color: transparent;
    font-size: 16px;            /* stops iPhones zooming the page in */
    z-index: 1;
  }

  /* Messages */
  .message{
    min-height: 30px;
    text-align:center;
    font-weight:800;
    font-size:1.05rem;
    margin-top:16px;
  }
  .message.ok{ color: var(--green-dark); }
  .message.bad{ color: var(--red-dark); }
  .message.info{ color: var(--primary-dark); }

  /* Transition overlay between activities */
  .overlay{
    position: fixed; inset:0;
    background: rgba(20,26,45,.55);
    display:flex; align-items:center; justify-content:center;
    padding:24px; z-index:50;
    animation: fadeIn .2s ease;
  }
  .overlay .overlay-card{
    background:#fff; border-radius:24px; padding:30px 26px;
    text-align:center; max-width:420px; width:100%;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
  }
  .overlay .overlay-emoji{ font-size:3.4rem; display:block; margin-bottom:8px; }
  .overlay .overlay-text{ font-size:1.25rem; font-weight:800; }

  /* ----------------------------- COMPLETION ----------------------------- */
  .complete-card{
    background:#fff; border-radius:24px; padding:36px 24px;
    text-align:center; box-shadow: var(--shadow);
    margin-top:30px;
  }
  .complete-card .big-emoji{ font-size:4.4rem; display:block; margin-bottom:10px; }
  .complete-card h2{ margin:0 0 10px; font-size: clamp(1.5rem,5vw,2rem); }
  .complete-card p{ color:var(--muted); font-size:1.05rem; margin:0 0 24px; line-height:1.5; }
  .complete-buttons{ display:flex; flex-direction:column; gap:12px; align-items:center; }

  /* ----------------------------- SOUND ----------------------------- */
  .sound-toggle{
    position: fixed; top: 12px; right: 12px; z-index: 60;
    width: 48px; height: 48px; border-radius: 50%;
    border: 2px solid var(--border); background:#fff;
    font-size: 1.35rem; line-height: 1; cursor: pointer;
    box-shadow: var(--shadow);
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color: transparent;
  }
  .sound-toggle:hover{ transform: translateY(-1px); }
  .sound-toggle:focus-visible{ outline: 3px solid #b9c1ff; outline-offset: 2px; }
  .sound-toggle.muted{ opacity:.72; }

  .sound-box{
    margin-top: 30px;
    display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;
    background:#fff; border:2px solid var(--border); border-radius:16px;
    padding:12px 16px; box-shadow: var(--shadow);
    font-size:.92rem; font-weight:700; color:var(--muted);
  }
  .volume-slider{
    -webkit-appearance:none; appearance:none;
    width:170px; max-width:42vw; height:8px; border-radius:999px;
    background: linear-gradient(90deg, var(--primary), #b9c1ff);
    outline:none; cursor:pointer;
  }
  .volume-slider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:22px; height:22px; border-radius:50%; background:#fff;
    border:3px solid var(--primary); box-shadow:0 2px 6px rgba(0,0,0,.2);
  }
  .volume-slider::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%; background:#fff;
    border:3px solid var(--primary); box-shadow:0 2px 6px rgba(0,0,0,.2);
  }
  .volume-slider:disabled{ opacity:.5; cursor:not-allowed; }

  .sound-divider{
    width:2px; height:26px; border-radius:2px; background:var(--border);
  }

  /* ---------- The 🔊 "Hear the word" button (learning screen) ---------- */
  .hear-row{
    display:flex; justify-content:center;
    margin: -6px 0 14px;
  }
  .hear-btn{
    font-family:inherit;
    font-size:1rem;
    font-weight:800;
    display:flex; align-items:center; gap:9px;
    padding: 10px 20px;
    border-radius: 999px;
    border: 3px solid #cfd6ff;
    background:#fff;
    color: var(--primary-dark);
    cursor:pointer;
    box-shadow: 0 4px 0 #dfe4ff;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .hear-btn:hover:not(:disabled){ background:#eef1ff; transform: translateY(-1px); }
  .hear-btn:active:not(:disabled){ transform: translateY(1px); box-shadow:none; }
  .hear-btn:disabled{ opacity:.55; cursor:not-allowed; box-shadow:none; }
  .hear-btn .hear-icon{ font-size:1.25rem; line-height:1; }
  .hear-btn.speaking{ background:#eef1ff; border-color: var(--primary); }
  .hear-btn.speaking .hear-icon{ animation: pulse .7s ease-in-out infinite; }

  @keyframes pulse{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.25); }
  }

  /* On narrow screens the fixed sound button could sit on top of the
     page headings, so leave room for it. */
  @media (max-width: 920px){
    .page-head, .learn-top{ padding-right: 58px; }
  }

  /* ----------------------------- SMALL SCREENS ----------------------------- */
  @media (max-width: 420px){
    .word-btn{ font-size:1.15rem; padding:16px 10px; }
    .topic-grid{ grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .btn{ font-size:1rem; }
    .btn.big{ font-size:1.25rem; padding:18px 30px; }
  }
</style>
</head>

<body>
<!-- Sound on/off button — always visible in the top-right corner -->
<button class="sound-toggle" id="btn-sound-toggle" type="button"
        aria-pressed="false" aria-label="Turn sounds off" title="Turn sounds on or off">🔊</button>

<div class="app">

  <!-- ============ SCREEN 1: HOME ============ -->
  <section id="screen-home" class="screen active">
    <div class="hero">
      <h1>📚 Vocabulary Trainer</h1>
      <p>Learn new English words with pictures, letters and spelling. Your progress is saved automatically.</p>
      <div class="hero-buttons">
        <button class="btn primary big" id="btn-vocabulary">Vocabulary</button>
        <button class="btn ghost" id="btn-resume" hidden>▶ Continue</button>
        <div class="resume-note" id="resume-note" hidden></div>
        <button class="btn link" id="btn-reset">Reset my progress</button>
      </div>

      <!-- Sound volume control (the starting volume is set in the SOUND settings
           further down this file — look for "soundSettings") -->
      <div class="sound-box">
        <span id="sound-box-label">🔊 Sound is on</span>
        <input class="volume-slider" id="volume-slider" type="range"
               min="0" max="100" step="5" value="70" aria-label="Sound volume" />
        <button class="btn ghost small" id="btn-sound-home" type="button">Mute</button>
        <span class="sound-divider" aria-hidden="true"></span>
        <button class="btn ghost small" id="btn-voice-home" type="button"
                aria-pressed="true">🗣️ Say words: On</button>
      </div>
    </div>
  </section>

  <!-- ============ SCREEN 2: TOPICS ============ -->
  <section id="screen-topics" class="screen">
    <div class="page-head">
      <h2>Choose a topic</h2>
      <button class="btn ghost small" id="btn-topics-home">🏠 Home</button>
    </div>
    <p class="page-sub">Pick what you want to learn today.</p>
    <div class="topic-grid" id="topic-grid"></div>
  </section>

  <!-- ============ SCREEN 3: LEVELS ============ -->
  <section id="screen-levels" class="screen">
    <div class="page-head">
      <h2 id="levels-title">Levels</h2>
      <button class="btn ghost small" id="btn-levels-topics">← Topics</button>
    </div>
    <p class="page-sub" id="levels-sub"></p>
    <div class="level-list" id="level-list"></div>
  </section>

  <!-- ============ SCREEN 4: LEARNING ============ -->
  <section id="screen-learn" class="screen">
    <div class="learn-top">
      <div class="learn-nav">
        <button class="btn ghost small" id="btn-learn-topics">← Topics</button>

const STORAGE_KEY = "vocabProgress_v1";  // finished levels are saved here
const SESSION_KEY = "vocabSession_v1";   // where the learner stopped is saved here

/* The three activity types, always in this order. The learner never sees
   the words "stage" or "activity A/B/C" — only these friendly headings. */
const ACTIVITY_ORDER = ["A", "B", "C"];
const ACTIVITY_TITLES = {
  A: "Choose the correct word",
  B: "Arrange the letters",
  C: "Type the word"
};

/* Used only if a level has too few words to create 2 wrong choices. */
const FALLBACK_WORDS = ["table", "water", "happy", "green", "small", "house", "light", "music"];

/* Shuffle (mix up) an array — used for answer buttons and letter tiles. */
function shuffle(list) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = copy[i];
    copy[i] = copy[j];
    copy[j] = temp;
  }
  return copy;
}

/* Small helper to create an HTML element in one line. */
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

/* Find a topic or a level inside the data object. */
function getTopic(topicId) {
  return vocabularyData.topics.find(function (t) { return t.id === topicId; }) || null;
}
function getLevel(topicId, levelId) {
  const topic = getTopic(topicId);
  if (!topic) return null;
  return topic.levels.find(function (l) { return l.id === levelId; }) || null;
}

/* ==================================================================
   2B) SOUND EFFECTS  —  built-in bleeps, no sound files needed
   ==================================================================

   HOW TO CHANGE HOW LOUD A SOUND IS
   ---------------------------------
   Every sound below has its own "volume" number between 0 and 1.
   Find the sound you want and change the number.
   A good range is 0.05 (very soft) up to 0.45 (loud).
   The volume slider on the home screen then adjusts everything together.

   HOW A SOUND IS MADE
   -------------------
   Each sound is a list of "notes". For every note you can set:
     freq : how high the note is, in Hz       (440 = the note A)
     at   : when it starts, in seconds        (0 = right away)
     dur  : how long it lasts, in seconds
     type : "sine" (soft, round), "triangle" (brighter),
            "square" (retro) or "sawtooth" (harsh)
     to   : OPTIONAL — slide the pitch to this frequency while playing
   ================================================================== */

const soundSettings = {
  enabled: true,   // sounds on or off (the learner can change this)
  volume: 0.7,     // the starting master volume, 0 to 1 (the slider changes this)

  sounds: {
    /* very soft tick on big navigation buttons */
    click:        { volume: 0.10, notes: [ { freq: 520, dur: 0.05, type: "sine" } ] },

    /* picking a letter up in "Arrange the letters" */
    tile:         { volume: 0.13, notes: [ { freq: 700, dur: 0.05, type: "triangle" } ] },

    /* putting a letter back, or pressing Clear */
    tileBack:     { volume: 0.11, notes: [ { freq: 390, dur: 0.06, type: "triangle" } ] },

    /* RIGHT answer: two happy notes going up */
    correct:      { volume: 0.26, notes: [
                      { freq: 784,  dur: 0.10, type: "sine" },
                      { freq: 1175, at: 0.09,  dur: 0.16, type: "sine" }
                    ] },

    /* WRONG answer: two gentle low notes going down (kind, never harsh) */
    wrong:        { volume: 0.20, notes: [
                      { freq: 330, dur: 0.14, type: "triangle" },
                      { freq: 233, at: 0.13, dur: 0.20, type: "triangle" }
                    ] },

    /* shown between the three activities: a rising three-note arpeggio */
    transition:   { volume: 0.28, notes: [
                      { freq: 659,  dur: 0.12, type: "sine" },
                      { freq: 880,  at: 0.10, dur: 0.12, type: "sine" },
                      { freq: 1046, at: 0.20, dur: 0.22, type: "sine" }
                    ] },

    /* a level is finished: short fanfare */
    levelComplete:{ volume: 0.34, notes: [
                      { freq: 523,  dur: 0.13, type: "sine" },
                      { freq: 659,  at: 0.12, dur: 0.13, type: "sine" },
                      { freq: 784,  at: 0.24, dur: 0.13, type: "sine" },
                      { freq: 1046, at: 0.36, dur: 0.34, type: "sine" },
                      { freq: 1318, at: 0.36, dur: 0.34, type: "sine" }
                    ] },

    /* the whole topic is finished: longer, bigger fanfare */
    topicComplete:{ volume: 0.40, notes: [
                      { freq: 523,  dur: 0.12, type: "sine" },
                      { freq: 587,  at: 0.11, dur: 0.12, type: "sine" },
                      { freq: 659,  at: 0.22, dur: 0.12, type: "sine" },
                      { freq: 784,  at: 0.33, dur: 0.12, type: "sine" },
                      { freq: 1046, at: 0.45, dur: 0.42, type: "sine" },
                      { freq: 1318, at: 0.45, dur: 0.42, type: "sine" },
                      { freq: 784,  at: 0.45, dur: 0.42, type: "triangle" }
                    ] }
  }
};

const SOUND_KEY = "vocabSound_v1";   // where the sound settings are remembered

/* Load the sound settings the learner chose last time. */
(function loadSoundSettings() {
  try {
    const raw = localStorage.getItem(SOUND_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (typeof saved.enabled === "boolean") soundSettings.enabled = saved.enabled;
    if (typeof saved.volume === "number") {
      soundSettings.volume = Math.min(Math.max(saved.volume, 0), 1);
    }
  } catch (e) { /* ignore broken saved data */ }
})();

function saveSoundSettings() {
  try {
    localStorage.setItem(SOUND_KEY, JSON.stringify({
      enabled: soundSettings.enabled,
      volume: soundSettings.volume
    }));
  } catch (e) {}
}

/* One shared audio engine. It is created the first time the learner taps
   something, because browsers block sound until the learner interacts. */
let audioCtx = null;
let masterGain = null;

function getAudio() {
  if (audioCtx) return audioCtx;
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return null;                       // very old browser: stay silent
  try {
    audioCtx = new Ctor();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = soundSettings.enabled ? soundSettings.volume : 0;
    masterGain.connect(audioCtx.destination);
  } catch (e) {
    audioCtx = null;                            // sound is optional: never break the app
  }
  return audioCtx;
}

/* Play a sound by name, for example: playSound("correct") */
function playSound(name) {
  if (!soundSettings.enabled) return;
  const sound = soundSettings.sounds[name];
  if (!sound) return;

  const ctx = getAudio();
  if (!ctx || !masterGain) return;
  if (ctx.state === "suspended" && ctx.resume) ctx.resume();

  const start = ctx.currentTime;

  sound.notes.forEach(function (note) {
    const at = start + (note.at || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = note.type || "sine";
    osc.frequency.setValueAtTime(note.freq, at);
    if (note.to) osc.frequency.exponentialRampToValueAtTime(note.to, at + note.dur);

    /* A tiny fade in and out, so the notes never click or pop. */
    const peak = Math.max(sound.volume, 0.0001);
    gain.gain.setValueAtTime(0.0001, at);
    gain.gain.exponentialRampToValueAtTime(peak, at + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + note.dur);

    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(at);
    osc.stop(at + note.dur + 0.05);
  });
}

/* Keep the mute button, the label and the slider in step. */
function updateSoundUI() {
  const on = soundSettings.enabled;
  const toggle   = document.getElementById("btn-sound-toggle");
  const boxLabel = document.getElementById("sound-box-label");
  const homeBtn  = document.getElementById("btn-sound-home");
  const slider   = document.getElementById("volume-slider");

  if (toggle) {
    toggle.textContent = on ? "🔊" : "🔇";
    toggle.classList.toggle("muted", !on);
    toggle.setAttribute("aria-pressed", on ? "false" : "true");
    toggle.setAttribute("aria-label", on ? "Turn sounds off" : "Turn sounds on");
  }
  if (boxLabel) boxLabel.textContent = on ? "🔊 Sound is on" : "🔇 Sound is off";
  if (homeBtn)  homeBtn.textContent  = on ? "Mute" : "Unmute";
  if (slider) {
    slider.value = Math.round(soundSettings.volume * 100);
    slider.disabled = !on;
  }
  if (masterGain && audioCtx && masterGain.gain.setTargetAtTime) {
    masterGain.gain.setTargetAtTime(on ? soundSettings.volume : 0, audioCtx.currentTime, 0.01);
  }

  /* Muting also silences the spoken word, so update those buttons too. */
  if (typeof updateVoiceUI === "function") updateVoiceUI();
  if (typeof updateHearButton === "function") updateHearButton();
}

function toggleSound() {
  soundSettings.enabled = !soundSettings.enabled;
  saveSoundSettings();
  if (soundSettings.enabled) getAudio();
  updateSoundUI();
  if (soundSettings.enabled) playSound("click");   // a little confirmation
}

document.getElementById("btn-sound-toggle").addEventListener("click", toggleSound);
document.getElementById("btn-sound-home").addEventListener("click", toggleSound);

document.getElementById("volume-slider").addEventListener("input", function (event) {
  soundSettings.volume = Number(event.target.value) / 100;
  saveSoundSettings();
  updateSoundUI();
});
document.getElementById("volume-slider").addEventListener("change", function () {
  updateSoundUI();
  playSound("correct");   // preview so the learner hears the new volume
});

/* Browsers only allow sound after the first tap or click. */
window.addEventListener("pointerdown", function unlockAudio() {
  getAudio();
  window.removeEventListener("pointerdown", unlockAudio);
});

/* ==================================================================
   2C) SPEECH — reads the word out loud (Web Speech API)
   ==================================================================

   THE WORD IS SPOKEN BY ITSELF when a new question appears (in all three
   activities), and the learner can tap the 🔊 "Hear the word" button under
   the picture to hear it again as often as they like.

   HOW TO CHANGE THE VOICE
   -----------------------
   speechSettings.rate      : how fast it talks. 1 = normal, 0.85 = a little slow
   speechSettings.pitch     : how high the voice is. 1 = normal
   speechSettings.volume    : how loud the voice is, 0 to 1
   speechSettings.autoSpeak : true  = say the word by itself on every question
                              false = only say it when the 🔊 button is tapped
   speechSettings.enabled   : false switches the voice off completely

   The app looks for an American voice (en-US) and prefers a female one.
   If it cannot find either, it uses the browser's default English voice.
   ================================================================== */

const speechSettings = {
  enabled: true,     // the voice is switched on
  autoSpeak: true,   // say the word by itself when a new question appears
  rate: 0.85,        // talking speed: 0.5 = very slow, 1 = normal, 1.5 = fast
  pitch: 1.05,       // 1 = normal voice height
  volume: 1          // voice loudness, 0 to 1 (separate from the game sounds)
};

const SPEECH_KEY = "vocabSpeech_v1";   // the learner's voice choices are remembered here

/* Load the saved voice choices. */
(function loadSpeechSettings() {
  try {
    const raw = localStorage.getItem(SPEECH_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (typeof saved.enabled === "boolean") speechSettings.enabled = saved.enabled;
    if (typeof saved.autoSpeak === "boolean") speechSettings.autoSpeak = saved.autoSpeak;
  } catch (e) { /* ignore broken saved data */ }
})();

function saveSpeechSettings() {
  try {
    localStorage.setItem(SPEECH_KEY, JSON.stringify({
      enabled: speechSettings.enabled,
      autoSpeak: speechSettings.autoSpeak
    }));
  } catch (e) {}
}

/* Voice names that usually mean a female voice, and ones that mean a male
   voice. These are only used to pick the nicest sounding voice. */
const FEMALE_VOICE_HINTS = ["female", "woman", "samantha", "zira", "aria", "jenny",
                            "michelle", "ava", "allie", "susan", "victoria", "karen",
                            "moira", "tessa", "serena", "zoe", "nicky", "google us english"];
const MALE_VOICE_HINTS   = ["male", "david", "alex", "daniel", "fred", "mark", "guy",
                            "ryan", "eric", "christopher", "james", "oliver", "aaron", "tom"];

let bestVoice = null;       // the voice we picked
let voicesLoaded = false;   // has the browser given us its voice list yet?

/* Score a voice: American English first, then a female sounding name. */
function scoreVoice(voice) {
  const name = (voice.name || "").toLowerCase();
  const lang = (voice.lang || "").toLowerCase();
  let score = 0;

  if (lang === "en-us") score += 100;            // American English
  else if (lang.indexOf("en") === 0) score += 40; // other English
  else score -= 300;                              // not English at all

  const soundsFemale = FEMALE_VOICE_HINTS.some(function (h) { return name.indexOf(h) !== -1; });
  const soundsMale   = MALE_VOICE_HINTS.some(function (h) { return name.indexOf(h) !== -1; });
  if (soundsFemale) score += 30;                  // female if possible
  if (soundsMale && !soundsFemale) score -= 20;

  if (name.indexOf("natural") !== -1 || name.indexOf("online") !== -1) score += 6; // nicer quality
  if (voice.localService) score += 3;             // works without internet
  return score;
}

/* Choose the best voice the browser has to offer. */
function pickBestVoice() {
  if (!window.speechSynthesis || !window.speechSynthesis.getVoices) return;
  const voices = window.speechSynthesis.getVoices() || [];
  if (!voices.length) return;                 // the browser is not ready yet
  voicesLoaded = true;

  let best = null;
  let bestScore = -Infinity;
  voices.forEach(function (voice) {
    const score = scoreVoice(voice);
    if (score > bestScore) { bestScore = score; best = voice; }
  });
  if (bestScore > -100) bestVoice = best;     // only accept English voices
}

/* The voice list arrives a moment after the page loads in some browsers. */
if (window.speechSynthesis) {
  pickBestVoice();
  if (window.speechSynthesis.addEventListener) {
    window.speechSynthesis.addEventListener("voiceschanged", pickBestVoice);
  } else {
    window.speechSynthesis.onvoiceschanged = pickBestVoice;
  }
}

/* Can this browser speak at all? */
function speechAvailable() {
  return !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
}

/* Say a word out loud.
   force = true means "the learner asked for it" (the 🔊 button).
   Nothing in here is allowed to break the game, so everything is guarded. */
function speakWord(word, force) {
  if (!word) return;
  if (!speechSettings.enabled) return;
  if (!force && !speechSettings.autoSpeak) return;
  if (!soundSettings.enabled) return;        // the main mute silences the voice too
  if (!speechAvailable()) return;

  try {
    if (!voicesLoaded) pickBestVoice();      // try once more, the list may be ready now

    /* Stop anything that is still talking, but only when something is. */
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
      window.speechSynthesis.cancel();
    }

    const utterance = new window.SpeechSynthesisUtterance(word);
    utterance.lang = (bestVoice && bestVoice.lang) ? bestVoice.lang : "en-US";
    if (bestVoice) utterance.voice = bestVoice;
    utterance.rate = speechSettings.rate;
    utterance.pitch = speechSettings.pitch;
    utterance.volume = speechSettings.volume;
    utterance.onstart = function () { setHearButtonSpeaking(true); };
    utterance.onend = function () { setHearButtonSpeaking(false); };
    /* If the browser blocks it (autoplay rules, no voice installed) we simply
       stay quiet — the 🔊 button still works when the learner taps it. */
    utterance.onerror = function () { setHearButtonSpeaking(false); };

    window.speechSynthesis.speak(utterance);
  } catch (e) {
    setHearButtonSpeaking(false);
  }
}

/* The key of the question we last spoke for, so a question is never
   spoken twice just because the screen was drawn again. */
let lastSpokenKey = "";

function questionKey() {
  return current.topicId + "|" + current.levelId + "|" + current.activity + "|" + current.qIndex;
}

/* Called by renderQuestion(). Speaks once per question, and only once. */
function autoSpeakFor(question) {
  if (!question) return;
  if (!speechSettings.enabled || !speechSettings.autoSpeak) return;

  const key = questionKey();
  if (key === lastSpokenKey) return;    // this question has already been read out
  lastSpokenKey = key;

  /* A small pause, so the word does not talk over the "correct!" sound. */
  window.setTimeout(function () {
    if (questionKey() !== key) return;  // the learner has already moved on
    speakWord(question.word, true);
  }, 400);
}

/* The little 🔊 button under the picture. */
function setHearButtonSpeaking(on) {
  const button = document.getElementById("btn-hear");
  if (button) button.classList.toggle("speaking", !!on);
}

function updateHearButton() {
  const button = document.getElementById("btn-hear");
  if (!button) return;
  const label = document.getElementById("hear-label");

  let text = "Hear the word";
  let usable = true;
  if (!speechAvailable()) { text = "Voice not supported"; usable = false; }
  else if (!speechSettings.enabled) { text = "Voice off"; usable = false; }
  else if (!soundSettings.enabled) { text = "Sound is off"; usable = false; }

  button.disabled = !usable;
  button.title = usable ? "Hear the word again" : text;
  if (label) label.textContent = text;
}

/* The on/off switch for the automatic voice (on the home screen). */
function updateVoiceUI() {
  const button = document.getElementById("btn-voice-home");
  if (!button) return;
  const on = speechSettings.enabled && speechAvailable();
  button.textContent = on ? "🗣️ Say words: On" : "🗣️ Say words: Off";
  button.setAttribute("aria-pressed", speechSettings.enabled ? "true" : "false");
  button.disabled = !speechAvailable();
}

function toggleSpeech() {
  speechSettings.enabled = !speechSettings.enabled;
  saveSpeechSettings();

  if (!speechSettings.enabled && window.speechSynthesis) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
  updateVoiceUI();
  updateHearButton();
  if (speechSettings.enabled) speakWord("hello", true);   // a little confirmation
}

document.getElementById("btn-hear").addEventListener("click", function () {
  const question = currentQuestion();
  if (question) speakWord(question.word, true);
});
document.getElementById("btn-voice-home").addEventListener("click", toggleSpeech);

/* ==================================================================
   3) PROGRESS + SESSION  (saved in localStorage)
   ================================================================== */

/* progress looks like this:  { "animals": ["level1", "level2"] }  */
let progress = loadProgress();

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};   // if something is broken, just start fresh
  }
}
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (e) {}
}
function isLevelComplete(topicId, levelId) {
  const done = progress[topicId] || [];
  return done.indexOf(levelId) !== -1;
}
function markLevelComplete(topicId, levelId) {
  if (!progress[topicId]) progress[topicId] = [];
  if (progress[topicId].indexOf(levelId) === -1) progress[topicId].push(levelId);
  saveProgress();
}
/* Rule: Level 1 is always open, level N opens when level N-1 is finished. */
function isLevelUnlocked(topicId, levelIndex) {
  if (levelIndex === 0) return true;
  const topic = getTopic(topicId);
  if (!topic) return false;
  const previous = topic.levels[levelIndex - 1];
  return isLevelComplete(topicId, previous.id);
}

/* Resume session: { topicId, levelId, activity, qIndex } */
function saveSession() {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(current)); } catch (e) {}
}
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}
function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}
/* Is the saved session still possible with today's data? */
function sessionIsValid(s) {
  if (!s) return false;
  const level = getLevel(s.topicId, s.levelId);
  if (!level) return false;
  if (ACTIVITY_ORDER.indexOf(s.activity) === -1) return false;
  if (typeof s.qIndex !== "number" || s.qIndex < 0 || s.qIndex >= level.questions.length) return false;
  if (isLevelComplete(s.topicId, s.levelId)) return false;
  return true;
}

const screens = {

};

function showScreen(name) {

    screens[key].classList.toggle("active", key === name);
  });

}

/* The current position of the learner */
let current = { topicId: null, levelId: null, activity: "A", qIndex: 0 };

/* Show or hide the "Continue" button on the home screen. */
function updateResumeButton() {
  const btn = document.getElementById("btn-resume");
  const note = document.getElementById("resume-note");
  const s = loadSession();

  if (!sessionIsValid(s)) {
    btn.hidden = true;
    note.hidden = true;
    return;
  }

  const topic = getTopic(s.topicId);
  const level = getLevel(s.topicId, s.levelId);
  const where = topic.name + " · " + level.name + " · " + ACTIVITY_TITLES[s.activity];

  btn.hidden = false;
  note.hidden = false;
  btn.textContent = "▶ Continue " + topic.name + " · " + level.name;
  note.innerHTML = "You stopped at <b>" + ACTIVITY_TITLES[s.activity] + "</b> — " +
                   "Question " + (s.qIndex + 1) + " of " + level.questions.length + ".<br>" + where;
}

/* ==================================================================
   6) TOPIC SCREEN
   ================================================================== */

function renderTopics() {
  const grid = document.getElementById("topic-grid");
  grid.innerHTML = "";

  vocabularyData.topics.forEach(function (topic) {
    const card = el("button", "topic-card");
    card.type = "button";

    card.appendChild(el("span", "topic-emoji", topic.emoji || "📘"));
    card.appendChild(el("span", "topic-name", topic.name));
    card.appendChild(el("span", "topic-count",
      topic.levels.length + (topic.levels.length === 1 ? " level" : " levels")));

    /* A green tick when every level of the topic is finished. */
    const finished = topic.levels.filter(function (lv) {
      return isLevelComplete(topic.id, lv.id);
    }).length;
    if (finished === topic.levels.length && topic.levels.length > 0) {
      card.appendChild(el("span", "done-badge", "✅"));
    }

    card.addEventListener("click", function () {
      playSound("click");
      renderLevels(topic.id);
      showScreen("levels");
    });

    grid.appendChild(card);
  });
}

/* ==================================================================
   7) LEVEL SCREEN
   ================================================================== */

let currentTopicForLevels = null;

function renderLevels(topicId) {
  const topic = getTopic(topicId);
  if (!topic) { showScreen("topics"); return; }
  currentTopicForLevels = topicId;

  document.getElementById("levels-title").textContent =
    (topic.emoji ? topic.emoji + " " : "") + topic.name;

  const doneCount = topic.levels.filter(function (lv) {
    return isLevelComplete(topic.id, lv.id);
  }).length;
  document.getElementById("levels-sub").textContent =
    doneCount + " of " + topic.levels.length + " levels finished. " +
    "Finish a level to open the next one.";

  const list = document.getElementById("level-list");
  list.innerHTML = "";

  topic.levels.forEach(function (level, index) {
    const unlocked = isLevelUnlocked(topic.id, index);
    const complete = isLevelComplete(topic.id, level.id);

    const card = el("button", "level-card" + (complete ? " complete" : ""));
    card.type = "button";
    card.disabled = !unlocked;

    const left = el("div");
    left.appendChild(el("div", "level-name", level.name));
    const info = level.questions.length + (level.questions.length === 1 ? " word" : " words");
    left.appendChild(el("div", "level-info",
      complete ? "✅ Completed — you can practise again" : info));
    card.appendChild(left);

    const state = el("div", "level-state");
    if (complete) state.textContent = "⭐";
    else if (unlocked) state.textContent = "▶";
    else state.textContent = "🔒";
    card.appendChild(state);

    if (!unlocked) {
      card.setAttribute("aria-label", level.name + " locked");
      card.title = "Locked — finish the level before it first";
    }

    card.addEventListener("click", function () {
      if (card.disabled) return;
      playSound("click");
      startLevel(topic.id, level.id, true);
    });

    list.appendChild(card);
  });
}

document.getElementById("btn-levels-topics").addEventListener("click", function () {
  playSound("click");
  renderTopics();
  showScreen("topics");
});

  showScreen("topics");
});
document.getElementById("btn-learn-levels").addEventListener("click", function () {
  playSound("click");
  if (currentTopicForLevels) {
    renderLevels(currentTopicForLevels);
    showScreen("levels");
  } else {
    renderTopics();
    showScreen("topics");
  }
});

/* ==================================================================
   8) STARTING A LEVEL
   ================================================================== */

/* resume = true  -> if the learner stopped in this level, continue there.
   resume = false -> always start from the beginning.                  */
function startLevel(topicId, levelId, resume) {
  const level = getLevel(topicId, levelId);
  if (!level) return;

  const saved = loadSession();

  if (resume && sessionIsValid(saved) &&
      saved.topicId === topicId && saved.levelId === levelId) {
    current = {
      topicId: topicId,
      levelId: levelId,
      activity: saved.activity,
      qIndex: saved.qIndex
    };
  } else {
    current = { topicId: topicId, levelId: levelId, activity: "A", qIndex: 0 };
  }

  currentTopicForLevels = topicId;

  /* Entering a level counts as a fresh start for the voice, so the word of
     the question we land on is read out again. */
  lastSpokenKey = "";

  saveSession();
  showScreen("learn");
  renderQuestion();
}

/* The question object we are working on right now. */
function currentQuestion() {
  const level = getLevel(current.topicId, current.levelId);
  if (!level) return null;
  return level.questions[current.qIndex] || null;
}

/* ==================================================================
   9) THE LEARNING SCREEN  (runs A -> B -> C automatically)
   ================================================================== */

function renderQuestion() {
  const topic = getTopic(current.topicId);
  const level = getLevel(current.topicId, current.levelId);
  const question = currentQuestion();

  if (!topic || !level || !question) {   // safety net if data changed
    clearSession();
    renderTopics();
    showScreen("topics");
    return;
  }

  document.getElementById("learn-level-tag").textContent =
    topic.name + " · " + level.name;

  document.getElementById("learn-progress").textContent =
    "Question " + (current.qIndex + 1) + "/" + level.questions.length;

  document.getElementById("learn-heading").textContent =
    ACTIVITY_TITLES[current.activity];

  setMessage("");

  /* Picture (shared by all three activities) */
  const imageBox = document.getElementById("learn-image");
  imageBox.innerHTML = "";
  imageBox.appendChild(buildImage(question));

  /* Body changes with the activity type */
  const body = document.getElementById("learn-body");
  body.innerHTML = "";

  /* Activity C is the only activity that uses the hidden typing box. */
  typingInput = null;
  cState = null;

  if (current.activity === "A") renderActivityA(body, level, question);
  else if (current.activity === "B") renderActivityB(body, level, question);
  else renderActivityC(body, question);

  /* The 🔊 button under the picture, and the voice that reads the word out
     by itself — see the SPEECH section for the settings. */
  updateHearButton();
  autoSpeakFor(question);

  /* Pictures from the internet take a moment, so fetch the next one early. */
  prefetchNextImage(level);
}

function setMessage(text, kind) {
  const box = document.getElementById("learn-message");
  box.textContent = text || "";
  box.className = "message" + (kind ? " " + kind : "");
}

/* ---------- The picture (or the emoji) ---------- */

/* Is this text a picture FILE (a path or a web link) or an emoji?
   A file path either contains a slash, or starts with http:// or https://,
   or ends with a picture ending like .png or .jpg.                      */
function isImagePath(value) {
  if (typeof value !== "string") return false;
  const text = value.trim();
  if (text === "") return false;
  if (/^https?:\/\//i.test(text)) return true;                              // https://...
  if (text.indexOf("/") !== -1 || text.indexOf("\\") !== -1) return true;   // images/cat.png
  return /\.(png|jpe?g|gif|svg|webp|bmp|avif|ico)$/i.test(text);            // cat.png
}

/* How many emoji are in this text? Marks like the variation selector and
   the zero width joiner are not separate emoji. Used to shrink combinations
   such as "🍎🍊" so that they still fit on a small screen.               */
function emojiCount(text) {
  return Array.from(String(text)).filter(function (ch) {
    const code = ch.codePointAt(0);
    if (code === 0xFE0F || code === 0xFE0E) return false;    // variation selector
    if (code === 0x200D) return false;                       // zero width joiner
    if (code === 0x20E3) return false;                       // keycap
    if (code >= 0x1F3FB && code <= 0x1F3FF) return false;    // skin tone
    return true;
  }).length;
}

/* Is this text a SENTENCE, or is it just emoji?
   A sentence has a real word in it: three or more letters in a row.
   "🐘 vs 🐭" has no such word ("vs" is only two letters), so it stays a
   big emoji picture. "She shares her toys." becomes a sentence.        */
function looksLikeSentence(text) {
  return /[A-Za-z]{3,}/.test(String(text));
}

/* Build the big centred emoji, with a label for screen readers. */
function buildEmojiFace(emoji, question) {
  const face = el("div", "emoji-face", emoji);
  const count = emojiCount(emoji);
  if (count > 1) face.classList.add("many");   // two or more emoji
  if (count > 3) face.classList.add("lots");   // a long combination, like "🐘 vs 🐭"
  face.setAttribute("role", "img");
  face.setAttribute("aria-label", question.alt || question.word);
  return face;
}

/* Build a short sentence: big and centred, but a little smaller than the
   emoji so that the whole sentence fits on the screen. */
function buildSentenceFace(sentence, question) {
  const face = el("div", "sentence-face", sentence);
  face.setAttribute("role", "img");
  face.setAttribute("aria-label", question.alt || sentence);
  return face;
}

/* A full web address, starting with http - used for pictures that are drawn
   for you on the internet, for example Pollinations.ai. */
function isWebUrl(value) {
  return typeof value === "string" && /^https?:\/\//i.test(value.trim());
}

/* A picture from the internet. These can take a few seconds to be drawn, so
   we show a friendly note while we wait, try once more if it fails, and only
   then fall back to the emoji or the placeholder. */
function buildWebImage(url, question) {
  const box = el("div", "web-image-box");

  const note = el("div", "image-loading");
  note.appendChild(el("span", "image-loading-icon", "🎨"));
  const noteText = el("div", "image-loading-text", "Drawing the picture…");
  note.appendChild(noteText);
  box.appendChild(note);

  const img = document.createElement("img");
  img.className = "web-image pending";
  img.alt = question.alt || question.word;

  let attempt = 0;
  const maxAttempts = 2;
  const isPollinations = url.indexOf("pollinations.ai") !== -1;

  function tryLoad() {
    attempt++;
    if (attempt > 1) noteText.textContent = "Still drawing…";
    let src = url;
    /* Ask for a fresh picture instead of the one that just failed. */
    if (attempt > 1 && isPollinations) {
      src += (url.indexOf("?") === -1 ? "?" : "&") + "seed=" + Math.floor(Math.random() * 1000000);
    }
    img.src = src;
  }

  img.onload = function () {
    img.classList.remove("pending");
    box.classList.add("ready");
  };
  img.onerror = function () {
    if (attempt < maxAttempts) { window.setTimeout(tryLoad, 1500); return; }
    box.innerHTML = "";
    box.appendChild(buildPlaceholder(question));
  };

  box.appendChild(img);
  tryLoad();
  return box;
}

/* Whatever is in the "image" field:
     "https://image.pollinations.ai/prompt/..."  -> a picture from the internet
     "images/cat.png"       -> a picture file next to this HTML file
     "🐱"  or  "🐘 vs 🐭"   -> the emoji (or the emoji) shown very large
     "She shares her toys." -> the sentence in big letters
     nothing at all         -> use "emoji", or a placeholder if there is none */
function buildImage(question) {
  const box = el("div");
  const image = question.image;

  /* 1) A web address: a picture from the internet. */
  if (isWebUrl(image)) return buildWebImage(image, question);

  /* 2) No picture file: it is either emoji or a short sentence. */
  if (image && !isImagePath(image)) {
    if (looksLikeSentence(image)) box.appendChild(buildSentenceFace(image, question));
    else box.appendChild(buildEmojiFace(image, question));
    return box;
  }

  /* 3) The image field holds a picture file. */
  if (image) {
    const img = document.createElement("img");
    img.src = image;
    img.alt = question.alt || question.word;   // alt text for screen readers
    img.onerror = function () {
      // The picture file was not found -> show the emoji or a placeholder.
      box.innerHTML = "";
      box.appendChild(buildPlaceholder(question));
    };
    box.appendChild(img);
    return box;
  }

  /* 4) No image field: use the optional "emoji", or a plain placeholder. */
  box.appendChild(buildPlaceholder(question));
  return box;
}

/* Start fetching the next question's internet picture while the learner is
   still busy with this one, so there is less waiting. Only the internet
   pictures are pre-fetched; local files and emoji need no loading. */
function prefetchNextImage(level) {
  if (!level) return;
  const next = level.questions[current.qIndex + 1];
  if (!next || !isWebUrl(next.image)) return;
  try {
    const pre = document.createElement("img");   // the browser keeps it in its cache
    pre.src = next.image;
  } catch (e) { /* never let this break the game */ }
}

/* Used when there is no picture to show: the optional "emoji" if there is
   one, otherwise a picture icon and the alt text (the word).            */
function buildPlaceholder(question) {
  const ph = el("div", "placeholder");
  if (question.emoji) {
    ph.appendChild(buildEmojiFace(question.emoji, question));
  } else {
    ph.appendChild(el("span", "ph-icon", "🖼️"));
    ph.appendChild(el("div", "ph-text", question.alt || question.word));
  }
  return ph;
}

/* ---------- ACTIVITY A : choose the correct word ---------- */

/* Build the three answer choices: the correct word + 2 wrong words. */
function buildChoices(level, question) {
  const correct = question.word;
  let wrong = [];

  if (question.distractors && question.distractors.length) {
    wrong = question.distractors.slice(0, 2);
  } else {
    /* No distractors given -> take other words from the same level. */
    const others = level.questions
      .map(function (q) { return q.word; })
      .filter(function (w) { return w.toLowerCase() !== correct.toLowerCase(); });

    wrong = shuffle(others).slice(0, 2);

    /* Not enough other words in this level? Use some common words. */
    while (wrong.length < 2) {
      const filler = FALLBACK_WORDS[Math.floor(Math.random() * FALLBACK_WORDS.length)];
      if (filler.toLowerCase() !== correct.toLowerCase() &&
          wrong.map(function (w) { return w.toLowerCase(); }).indexOf(filler.toLowerCase()) === -1) {
        wrong.push(filler);
      }
    }
  }

  return shuffle([correct].concat(wrong));
}

function renderActivityA(body, level, question) {
  const wrap = el("div", "word-buttons");
  const choices = buildChoices(level, question);
  const answered = { done: false };

  choices.forEach(function (word) {
    const btn = el("button", "word-btn");
    btn.type = "button";
    btn.textContent = word;

    btn.addEventListener("click", function () {
      if (answered.done) return;   // freeze the buttons after the right answer

      if (word.toLowerCase() === question.word.toLowerCase()) {
        /* CORRECT: green button + tick, then move on. */
        answered.done = true;
        playSound("correct");
        btn.classList.add("correct");
        btn.appendChild(el("span", "mark", "✓"));
        setMessage("Correct! ✓", "ok");
        Array.prototype.forEach.call(wrap.children, function (b) { b.disabled = true; });
        window.setTimeout(advance, 900);
      } else {
        /* WRONG: red button + cross. The cross stays until the learner
           clicks the correct word — we never move on from a wrong click. */
        playSound("wrong");
        btn.classList.add("wrong");
        if (!btn.querySelector(".mark")) btn.appendChild(el("span", "mark", "✗"));
        btn.disabled = true;
        setMessage("Not quite — try again. ✗", "bad");
      }
    });

    wrap.appendChild(btn);
  });

  body.appendChild(wrap);
}

/* ---------- ACTIVITY B : arrange the letters ---------- */

/* Letters of the current question, mixed up. Each tile has its own id so
   words with a repeated letter (like "apple") work correctly.            */
function makeTiles(word) {
  const letters = word.toLowerCase().split("");
  let mixed = shuffle(letters);
  if (letters.length > 1 && mixed.join("") === letters.join("")) {
    mixed = shuffle(letters);   // very unlikely, but avoid the easy start
  }
  return mixed.map(function (ch, i) { return { id: "t" + i + "_" + ch, ch: ch }; });
}

/* State of activity B for the current question. */
let bState = { tiles: [], built: [], locked: false, errorTimer: null };

function renderActivityB(body, level, question) {
  /* Fresh state every time we show a new question. */
  if (bState.questionKey !== current.topicId + "|" + current.levelId + "|" + current.qIndex) {
    bState = {
      questionKey: current.topicId + "|" + current.levelId + "|" + current.qIndex,
      tiles: makeTiles(question.word),
      built: [],
      locked: false,
      errorTimer: null
    };
  }

  const builtArea = el("div", "built-area");
  const tilesArea = el("div", "tiles");

  drawB();

  function drawB() {
    /* --- the word the learner is building --- */
    builtArea.innerHTML = "";
    builtArea.className = "built-area";
    if (bState.built.length === 0) {
      builtArea.appendChild(el("span", "hint-text", "Tap the letters below in the right order"));
    } else {
      bState.built.forEach(function (tile) {
        const t = el("button", "tile small-tile", tile.ch);
        t.type = "button";
        t.title = "Tap to take this letter back";
        t.addEventListener("click", function () {
          if (bState.locked) return;
          const index = bState.built.indexOf(tile);
          if (index !== -1) {
            playSound("tileBack");
            bState.built.splice(index, 1);
            bState.tiles.push(tile);
            setMessage("");
            drawB();
          }
        });
        builtArea.appendChild(t);
      });
    }

    /* --- the mixed-up letters still available --- */
    tilesArea.innerHTML = "";
    bState.tiles.forEach(function (tile) {
      const t = el("button", "tile", tile.ch);
      t.type = "button";
      t.addEventListener("click", function () {
        if (bState.locked) return;
        const index = bState.tiles.indexOf(tile);
        if (index === -1) return;
        playSound("tile");
        bState.tiles.splice(index, 1);
        bState.built.push(tile);
        setMessage("");
        drawB();
        checkB();
      });
      tilesArea.appendChild(t);
    });
  }

  function checkB() {
    const guess = bState.built.map(function (t) { return t.ch; }).join("");
    const answer = question.word.toLowerCase();

    if (guess.length < answer.length) return;   // not finished yet

    if (guess === answer) {
      /* CORRECT */
      bState.locked = true;
      playSound("correct");
      builtArea.classList.add("ok");
      setMessage("Perfect! ✓", "ok");
      window.setTimeout(advance, 900);
    } else {
      /* WRONG: show the error, then give the letters back to try again. */
      bState.locked = true;
      playSound("wrong");
      builtArea.classList.add("bad");
      setMessage("That is not right — let's try again. ✗", "bad");

      const keyWhenStarted = bState.questionKey;
      bState.errorTimer = window.setTimeout(function () {
        /* If the learner already moved on, do nothing. */
        if (bState.questionKey !== keyWhenStarted) return;
        bState.tiles = makeTiles(question.word);
        bState.built = [];
        bState.locked = false;
        setMessage("Try again — build the word.", "info");
        drawB();
      }, 1100);
    }
  }

  const clearBtn = el("button", "btn ghost", "↩ Backspace");
  clearBtn.type = "button";
  clearBtn.addEventListener("click", function () {
    if (bState.locked) return;
    playSound("tileBack");
    const last = bState.built.pop();
    if (last) bState.tiles.push(last);
    setMessage("");
    drawB();
  });

  const resetBtn = el("button", "btn ghost", "🗑 Clear");
  resetBtn.type = "button";
  resetBtn.addEventListener("click", function () {
    if (bState.locked) return;
    playSound("tileBack");
    bState.tiles = bState.tiles.concat(bState.built);
    bState.built = [];
    setMessage("");
    drawB();
  });

  const actions = el("div", "action-row");
  actions.appendChild(clearBtn);
  actions.appendChild(resetBtn);

  body.appendChild(builtArea);
  body.appendChild(tilesArea);
  body.appendChild(actions);
}

/* ---------- ACTIVITY C : type the word straight onto the blanks ---------- */

/* Settings for this activity.
   showFirstLetterHint: true  -> the first letter is given for free and the
                                 learner types the rest.
                        false -> the learner types every letter.
   The answer is always checked automatically — there is no Check button. */
const typingSettings = {
  showFirstLetterHint: true
};

/* These two only exist while activity C is showing. */
let typingInput = null;   // the hidden box that catches the typing
let cState = null;        // everything needed to draw and check the blanks

function renderActivityC(body, question) {
  /* Letters only: this keeps words like "hard-working" or "t-shirt" playable,
     because the learner only types the letters (the hyphen is ignored here). */
  const word = question.word.toLowerCase().replace(/[^a-z]/g, "") ||
               question.word.toLowerCase();
  const hintOn = typingSettings.showFirstLetterHint && word.length > 1;
  const startAt = hintOn ? 1 : 0;        // slot 0 is the free hint letter
  const needed = word.length - startAt;  // how many letters the learner types

  /* --- the blanks (one box per letter) --- */
  const wrap = el("div", "spell-slots");
  const slots = [];
  for (let i = 0; i < word.length; i++) {
    const box = el("div", "spell-slot");
    const char = el("span", "spell-char", "_");   // starts as an underscore
    box.appendChild(char);
    wrap.appendChild(box);
    slots.push({ box: box, char: char });
  }
  body.appendChild(wrap);

  /* --- a small line that says what to do --- */
  body.appendChild(el("div", "type-hint",
    hintOn ? "Type the missing letters — the first letter is given."
           : "Type the word."));

  /* --- the hidden input that catches the keystrokes ---
     It is almost invisible (1 pixel in the top corner), but it is a real
     text box, so phones show their keyboard and Backspace works normally. */
  const input = document.createElement("input");
  input.type = "text";
  input.className = "type-catcher";
  input.setAttribute("aria-label", "Type the word");
  input.setAttribute("autocomplete", "off");
  input.setAttribute("autocapitalize", "none");
  input.setAttribute("autocorrect", "off");
  input.setAttribute("spellcheck", "false");
  body.appendChild(input);

  /* Remember everything, then draw the empty blanks. */
  cState = {
    word: word,
    hintOn: hintOn,
    startAt: startAt,
    needed: needed,
    typed: "",          // the letters the learner has typed so far
    locked: false,      // true once the answer is correct (no more typing)
    slots: slots,
    wrap: wrap,
    input: input
  };
  typingInput = input;
  drawTyping();

  /* ---- Every key press ends up here ----
     The hidden box always holds exactly the letters that are shown on the
     blanks, so Backspace and the phone "delete" key are handled by the
     browser itself and we simply redraw what is left. */
  input.addEventListener("input", function () {
    if (!cState || cState.locked) return;

    const before = cState.typed;

    /* Letters only (a-z), and never more than there are blanks. */
    const raw = input.value.toLowerCase().replace(/[^a-z]/g, "").slice(0, cState.needed);

    cState.typed = raw;
    input.value = raw;               // keep the hidden box in step with the blanks
    clearTypingError();

    if (raw.length > before.length) playSound("tile");          // a letter went in
    else if (raw.length < before.length) playSound("tileBack"); // a letter came out

    drawTyping();
    checkTyping();
  });

  /* The forward "Delete" key should also take the last letter away.
     (Backspace is left to the browser, which works on every device.) */
  input.addEventListener("keydown", function (event) {
    if (!cState || cState.locked) return;
    if (event.key === "Enter") { event.preventDefault(); return; }
    if (event.key === "Delete" && cState.typed.length > 0) {
      event.preventDefault();
      cState.typed = cState.typed.slice(0, -1);
      input.value = cState.typed;
      clearTypingError();
      playSound("tileBack");
      drawTyping();
    }
  });

  /* When the phone keyboard opens, keep the blanks on screen. */
  input.addEventListener("focus", function () {
    window.setTimeout(function () {
      if (cState && cState.wrap && cState.wrap.scrollIntoView) {
        cState.wrap.scrollIntoView({ block: "center" });
      }
    }, 250);
  });

  /* Put the cursor there straight away: on a computer the learner can type
     at once, on a phone the keyboard opens with the first tap. */
  window.setTimeout(function () {
    if (typingInput === input) input.focus();
  }, 60);
}

/* Draw the blanks: the free hint letter, the typed letters, "_" for the rest. */
function drawTyping() {
  if (!cState) return;
  const typed = cState.typed;

  cState.slots.forEach(function (slot, i) {
    let value = "_";
    let state = "";

    if (cState.hintOn && i === 0) {
      value = cState.word.charAt(0);     // the free first letter
      state = "hint";
    } else {
      const typedIndex = i - cState.startAt;
      if (typedIndex >= 0 && typedIndex < typed.length) {
        value = typed.charAt(typedIndex);
        state = "filled";
      }
    }

    slot.char.textContent = value;
    slot.box.className = "spell-slot" + (state ? " " + state : "");
  });

  /* Show where the next letter will go (a softly blinking underscore). */
  const nextIndex = cState.startAt + typed.length;
  if (!cState.locked && nextIndex < cState.slots.length) {
    cState.slots[nextIndex].box.classList.add("next");
  }
}

/* Runs after every change: when all the blanks are full, check the answer. */
function checkTyping() {
  if (!cState || cState.locked) return;
  if (cState.typed.length < cState.needed) return;      // blanks still empty

  const built = (cState.hintOn ? cState.word.charAt(0) : "") + cState.typed;

  if (built === cState.word) {
    /* CORRECT — green tick, then the next question. */
    cState.locked = true;
    playSound("correct");
    cState.wrap.classList.add("ok");
    setMessage("Excellent spelling! ✓", "ok");
    cState.input.blur();                 // close the phone keyboard
    window.setTimeout(advance, 900);
  } else {
    /* WRONG — the letters stay so the learner can fix them with Backspace. */
    playSound("wrong");
    cState.wrap.classList.add("bad");
    setMessage("Not correct — press Backspace to fix it. ✗", "bad");
  }
}

/* Remove the red shake and the message as soon as the learner edits again. */
function clearTypingError() {
  if (!cState) return;
  cState.wrap.classList.remove("bad");
  setMessage("");
}

/* Tapping the picture or the blanks brings the phone keyboard back.
   The focus happens straight away (not after a delay), because iPhones
   only open the keyboard when focus() runs inside the tap itself. */
document.addEventListener("pointerdown", function (event) {
  if (current.activity !== "C" || !typingInput) return;
  if (!screens.learn.classList.contains("active")) return;   // not on the learning screen
  const tag = event.target && event.target.tagName ? event.target.tagName.toLowerCase() : "";
  if (tag === "button" || tag === "input") return;           // let the real buttons work
  typingInput.focus();
});

/* ==================================================================
   10) MOVING FROM ONE QUESTION / ACTIVITY TO THE NEXT
   ================================================================== */

function advance() {
  const level = getLevel(current.topicId, current.levelId);
  if (!level) return;

  if (current.qIndex + 1 < level.questions.length) {
    current.qIndex = current.qIndex + 1;
    saveSession();
    showScreen("learn");
    renderQuestion();
  } else {
    nextActivity();
  }
}

function nextActivity() {
  const position = ACTIVITY_ORDER.indexOf(current.activity);

  if (position < ACTIVITY_ORDER.length - 1) {
    const next = ACTIVITY_ORDER[position + 1];
    const message = (next === "B")
      ? "Great! Now arrange the letters."
      : "Well done! Now type the word.";

    showOverlay(message, next === "B" ? "🎉" : "🌟", function () {
      current.activity = next;
      current.qIndex = 0;
      bState = {};                 // clear letter tiles for the new question
      saveSession();
      renderQuestion();
    });
  } else {
    finishLevel();
  }
}

/* A short, friendly pop-up shown between the three activities. */
function showOverlay(text, emoji, then) {
  const overlay = el("div", "overlay");
  const card = el("div", "overlay-card");
  card.appendChild(el("span", "overlay-emoji", emoji));
  card.appendChild(el("div", "overlay-text", text));
  overlay.appendChild(card);
  document.body.appendChild(overlay);

  playSound("transition");

  window.setTimeout(function () {
    overlay.remove();
    then();
  }, 1500);
}

/* ==================================================================
   11) FINISHING A LEVEL
   ================================================================== */

function finishLevel() {
  const topic = getTopic(current.topicId);
  const level = getLevel(current.topicId, current.levelId);
  if (!topic || !level) return;

  markLevelComplete(topic.id, level.id);

  const index = topic.levels.indexOf(level);
  const nextLevel = topic.levels[index + 1] || null;

  clearSession();
  bState = {};
  typingInput = null;    // the typing activity is over
  cState = null;

  renderComplete(topic, level, nextLevel);
  showScreen("complete");

  /* Last level of the topic -> bigger fanfare */
  playSound(nextLevel ? "levelComplete" : "topicComplete");
}

function renderComplete(topic, level, nextLevel) {
  const buttons = document.getElementById("complete-buttons");
  buttons.innerHTML = "";

  document.getElementById("complete-emoji").textContent = nextLevel ? "🎉" : "🏆";
  document.getElementById("complete-title").textContent =
    nextLevel ? (level.name + " complete!") : ("You finished " + topic.name + "!");

  document.getElementById("complete-text").textContent = nextLevel
    ? "Well done! " + nextLevel.name + " is now unlocked."
    : "Amazing work — you completed every level in " + topic.name + ". Try another topic!";

  /* "Next Level" button (only if another level exists) */
  if (nextLevel) {
    const nextBtn = el("button", "btn primary", "Next Level →");
    nextBtn.type = "button";
    nextBtn.addEventListener("click", function () {
      playSound("click");
      startLevel(topic.id, nextLevel.id, false);
    });
    buttons.appendChild(nextBtn);
  } else {
    const topicsBtn = el("button", "btn primary", "Choose another topic");
    topicsBtn.type = "button";
    topicsBtn.addEventListener("click", function () {
      playSound("click");
      renderTopics();
      showScreen("topics");
    });
    buttons.appendChild(topicsBtn);
  }

  /* "Back to Levels" button (not needed when the whole topic is finished) */
  if (nextLevel) {
    const levelsBtn = el("button", "btn ghost", "Back to Levels");
    levelsBtn.type = "button";
    levelsBtn.addEventListener("click", function () {
      playSound("click");
      renderLevels(topic.id);
      showScreen("levels");
    });
    buttons.appendChild(levelsBtn);
  }

  const topicsBtn2 = el("button", "btn ghost", "Back to Topics");
  topicsBtn2.type = "button";
  topicsBtn2.addEventListener("click", function () {
    playSound("click");
    renderTopics();
    showScreen("topics");
  });
  buttons.appendChild(topicsBtn2);
}

/* ==================================================================
   12) START THE APP
   ================================================================== */

updateResumeButton();
updateSoundUI();
showScreen("home");
</script>
